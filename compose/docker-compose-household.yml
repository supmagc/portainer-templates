version: "3.3"

name: household

networks:
  default:
    driver: bridge
  utilities_default:
    external: true

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    networks:
      - default
      - utilities_default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.mealie-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.mealie.rule=Host(`mealie.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.mealie.entrypoints=web"
      - "traefik.http.routers.mealie.middlewares=mealie-https-redirect"
      - "traefik.http.routers.mealie-secure.rule=Host(`mealie.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.mealie-secure.entrypoints=web-secure"
      - "traefik.http.routers.mealie-secure.tls=true"
      - "traefik.http.routers.mealie-secure.tls.certresolver=stepca"
      - "traefik.http.services.mealie.loadbalancer.server.port=9000"
    ports:
      - ${NETWORK_INTERFACE}:9925:9000/tcp
    secrets:
      - mealie-postgres-password
    volumes:
      - /mnt/fastpool/system/household/mealie:/app/data
    environment:
      - TZ=${APP_TIMEZONE}
      - PUID=${APP_USER}
      - PGID=${APP_GROUP}
      - BASE_URL=https://mealie.${NETWORK_DOMAIN}
      - ALLOW_SIGNUP=false
      - DB_ENGINE=postgres
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mealie
      - POSTGRES_USER=mealie
      - POSTGRES_PASSWORD_FILE=/run/secrets/mealie-postgres-password
    deploy:
      resources:
        limits:
          memory: 1000M

  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    user: ${APP_USER}:${APP_GROUP}
    networks:
      - default
      - utilities_default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.vikunja-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.vikunja.rule=Host(`vikunja.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.vikunja.entrypoints=web"
      - "traefik.http.routers.vikunja.middlewares=vikunja-https-redirect"
      - "traefik.http.routers.vikunja-secure.rule=Host(`vikunja.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.vikunja-secure.entrypoints=web-secure"
      - "traefik.http.routers.vikunja-secure.tls=true"
      - "traefik.http.routers.vikunja-secure.tls.certresolver=stepca"
      - "traefik.http.services.vikunja.loadbalancer.server.port=3456"
    ports:
      - ${NETWORK_INTERFACE}:3456:3456/tcp
    secrets:
      - vikunja-postgres-password
      - vikunja-secret
    volumes:
      - /mnt/fastpool/system/household/vikunja/files:/app/vikunja/files
    environment:
      - VIKUNJA_SERVICE_TIMEZONE=${APP_TIMEZONE}
      - VIKUNJA_SERVICE_PUBLICURL=https://vikunja.${NETWORK_DOMAIN}/
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=false   # set true for first-user signup, then back to false
      - VIKUNJA_SERVICE_SECRET_FILE=/run/secrets/vikunja-secret
      - VIKUNJA_METRICS_ENABLED=true   # unauthenticated /api/v1/metrics - blocked publicly in traefik-edge/dynamic/vikunja.yml
      - VIKUNJA_DATABASE_TYPE=postgres
      - VIKUNJA_DATABASE_HOST=postgres
      - VIKUNJA_DATABASE_DATABASE=vikunja
      - VIKUNJA_DATABASE_USER=vikunja
      - VIKUNJA_DATABASE_PASSWORD_FILE=/run/secrets/vikunja-postgres-password
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.homarr-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.homarr.rule=Host(`homarr.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.homarr.entrypoints=web"
      - "traefik.http.routers.homarr.middlewares=homarr-https-redirect"
      - "traefik.http.routers.homarr-secure.rule=Host(`homarr.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.homarr-secure.entrypoints=web-secure"
      - "traefik.http.routers.homarr-secure.tls=true"
      - "traefik.http.routers.homarr-secure.tls.certresolver=stepca"
      - "traefik.http.services.homarr.loadbalancer.server.port=7575"
    ports:
      - ${NETWORK_INTERFACE}:7575:7575/tcp
    secrets:
      - homarr-encryption-key
    volumes:
      - /mnt/fastpool/system/household/homarr:/appdata
    environment:
      - TZ=${APP_TIMEZONE}
      - PUID=${APP_USER}
      - PGID=${APP_GROUP}
      - BASE_URL=https://homarr.${NETWORK_DOMAIN}
      - SECRET_ENCRYPTION_KEY_FILE=/run/secrets/homarr-encryption-key

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.homepage-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=web"
      - "traefik.http.routers.homepage.middlewares=homepage-https-redirect"
      - "traefik.http.routers.homepage-secure.rule=Host(`homepage.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.homepage-secure.entrypoints=web-secure"
      - "traefik.http.routers.homepage-secure.tls=true"
      - "traefik.http.routers.homepage-secure.tls.certresolver=stepca"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
    ports:
      - ${NETWORK_INTERFACE}:3000:3000/tcp
    volumes:
      - /mnt/fastpool/system/household/homepage:/app/config
    environment:
      - TZ=${APP_TIMEZONE}
      - PUID=${APP_USER}
      - PGID=${APP_GROUP}
      - HOMEPAGE_ALLOWED_HOSTS=homepage.${NETWORK_DOMAIN},${NETWORK_INTERFACE}:3000

  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    user: ${APP_USER}:${APP_GROUP}
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.dashy-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.dashy.rule=Host(`dashy.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.dashy.entrypoints=web"
      - "traefik.http.routers.dashy.middlewares=dashy-https-redirect"
      - "traefik.http.routers.dashy-secure.rule=Host(`dashy.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.dashy-secure.entrypoints=web-secure"
      - "traefik.http.routers.dashy-secure.tls=true"
      - "traefik.http.routers.dashy-secure.tls.certresolver=stepca"
      - "traefik.http.services.dashy.loadbalancer.server.port=8080"
    ports:
      - ${NETWORK_INTERFACE}:4000:8080/tcp
    volumes:
      - /mnt/fastpool/system/household/dashy:/app/user-data   # must contain conf.yml before first start
    environment:
      - TZ=${APP_TIMEZONE}
      - NODE_ENV=production

  openwebui:
    image: ghcr.io/open-webui/open-webui:slim
    container_name: openwebui
    user: ${APP_USER}:${APP_GROUP}   # VERIFY: upstream calls non-root untested; drop this line if startup fails on permissions
    networks:
      - default
      - utilities_default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.openwebui-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.openwebui.rule=Host(`openwebui.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.openwebui.entrypoints=web"
      - "traefik.http.routers.openwebui.middlewares=openwebui-https-redirect"
      - "traefik.http.routers.openwebui-secure.rule=Host(`openwebui.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.openwebui-secure.entrypoints=web-secure"
      - "traefik.http.routers.openwebui-secure.tls=true"
      - "traefik.http.routers.openwebui-secure.tls.certresolver=stepca"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
    ports:
      - ${NETWORK_INTERFACE}:3080:8080/tcp
    secrets:
      - openwebui-env
      - openwebui-secret-key
    volumes:
      - /mnt/fastpool/system/household/openwebui:/app/backend/data
    # DATABASE_URL and OPENAI_API_KEY come from the openwebui-env secret file; format in docs/household-ai.md
    command: ["bash", "-c", "set -a; . /run/secrets/openwebui-env; set +a; exec bash start.sh"]
    environment:
      - TZ=${APP_TIMEZONE}
      - HOME=/app/backend/data
      - WEBUI_URL=https://openwebui.${NETWORK_DOMAIN}
      - CORS_ALLOW_ORIGIN=https://openwebui.${NETWORK_DOMAIN}
      - WEBUI_SECRET_KEY_FILE=/run/secrets/openwebui-secret-key
      - DEFAULT_USER_ROLE=pending
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=https://router.requesty.ai/v1
      - ENABLE_FORWARD_USER_INFO_HEADERS=false   # true would also send user emails to Requesty
      - VECTOR_DB=pgvector
      - PGVECTOR_CREATE_EXTENSION=false
      - PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH=768   # must match the embed model (default 1536 breaks inserts)
      - PGVECTOR_INDEX_METHOD=hnsw
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_OLLAMA_BASE_URL=http://ollama:11434
      - RAG_EMBEDDING_MODEL=embeddinggemma
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search
    deploy:
      resources:
        limits:
          memory: 2000M

secrets:
  homarr-encryption-key:
    file: /mnt/fastpool/system/processes/secrets/homarr-encryption-key.txt
  mealie-postgres-password:
    file: /mnt/fastpool/system/processes/secrets/mealie-postgres-password.txt
  openwebui-env:
    file: /mnt/fastpool/system/processes/secrets/openwebui-env.txt
  openwebui-secret-key:
    file: /mnt/fastpool/system/processes/secrets/openwebui-secret-key.txt
  vikunja-postgres-password:
    file: /mnt/fastpool/system/processes/secrets/vikunja-postgres-password.txt
  vikunja-secret:
    file: /mnt/fastpool/system/processes/secrets/vikunja-secret.txt
