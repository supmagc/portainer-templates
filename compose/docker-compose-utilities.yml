version: "3.3"

name: utilities

networks:
  default:
    driver: bridge

services:
  chromedp:
    image: chromedp/headless-shell:latest
    container_name: chromedp
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - TZ=${APP_TIMEZONE}
      - CHROMEDP_DISABLE_GPU=true
      - CHROMEDP_DISABLE_DEV_SHM=false
      - CHROMEDP_DISABLE_SANDBOX=true
      - CHROMEDP_DISABLE_XVFB=false
      - CHROMEDP_ENABLE_HEADLESS=true
      - CHROMEDP_ENABLE_NO_SANDBOX=true
      - CHROMEDP_ENABLE_XVFB=false

  mariadb:
    image: mariadb:lts
    container_name: mariadb
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    user: ${APP_USER}:${APP_GROUP}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - ${NETWORK_INTERFACE}:3306:3306/tcp
    volumes:
      - /mnt/fastpool/system/processes/mariadb:/var/lib/mysql:Z
    environment:
      - TZ=${APP_TIMEZONE}
      - PGID=${APP_USER}
      - PUID=${APP_GROUP}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    command:
      - --innodb-buffer-pool-size=1G
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --event-scheduler=ON
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  dagu:
    image: ghcr.io/dagucloud/dagu:latest
    container_name: dagu
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.http.middlewares.dagu-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.dagu.rule=Host(`dagu.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.dagu.entrypoints=web"
      - "traefik.http.routers.dagu.middlewares=dagu-https-redirect"
      - "traefik.http.routers.dagu-secure.rule=Host(`dagu.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.dagu-secure.entrypoints=web-secure"
      - "traefik.http.routers.dagu-secure.tls=true"
      - "traefik.http.routers.dagu-secure.tls.certresolver=stepca"
      - "traefik.http.services.dagu.loadbalancer.server.port=8080"
    ports:
      - ${NETWORK_INTERFACE}:9923:8080/tcp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/fastpool/system/processes/dagu:/config
    environment:
      - PUID=${APP_USER}
      - PGID=${APP_GROUP}
      - DOCKER_GID=${DOCKER_USER}
      - TZ=${APP_TIMEZONE}
      - DAGU_TZ=${APP_TIMEZONE}
      - DAGU_HOME=/config
      - DAGU_HOST=0.0.0.0
      - DAGU_PORT=8080
      - DAGU_AUTH_MODE=buitin
      - DAGU_SERVER_METRICS=public

  postgres:
    image: ghcr.io/immich-app/postgres:17-vectorchord1.1.1-pgvector0.8.5
    container_name: postgres
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    user: ${APP_USER}:${APP_GROUP}
    shm_size: 1gb
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - ${NETWORK_INTERFACE}:5432:5432/tcp
    secrets:
      - postgres-pass
    volumes:
      - /mnt/fastpool/system/processes/postgres:/var/lib/postgresql/data
    environment:
      - TZ=${APP_TIMEZONE}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres-pass
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_USER=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.phpmyadmin-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.phpmyadmin.rule=Host(`phpmyadmin.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.phpmyadmin.entrypoints=web"
      - "traefik.http.routers.phpmyadmin.middlewares=phpmyadmin-https-redirect"
      - "traefik.http.routers.phpmyadmin-secure.rule=Host(`phpmyadmin.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.phpmyadmin-secure.entrypoints=web-secure"
      - "traefik.http.routers.phpmyadmin-secure.tls=true"
      - "traefik.http.routers.phpmyadmin-secure.tls.certresolver=stepca"
    ports:
      - ${NETWORK_INTERFACE}:3307:80/tcp
    environment:
      - PMA_HOST=mariadb
      - PMA_PMADB=pmadb
      - PMA_ARBITRARY=0

  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning ping | grep PONG"]
      start_period: 10s
      interval: 30s
      retries: 3
      timeout: 3s

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.rabbitmq-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.routers.rabbitmq.middlewares=rabbitmq-https-redirect"
      - "traefik.http.routers.rabbitmq-secure.rule=Host(`rabbitmq.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.rabbitmq-secure.entrypoints=web-secure"
      - "traefik.http.routers.rabbitmq-secure.tls=true"
      - "traefik.http.routers.rabbitmq-secure.tls.certresolver=stepca"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
    ports:
      - ${NETWORK_INTERFACE}:15672:15672/tcp
    volumes:
      - /mnt/fastpool/system/processes/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - /mnt/fastpool/system/processes/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - /mnt/fastpool/system/processes/rabbitmq/data/:/var/lib/rabbitmq/
      - /mnt/fastpool/system/processes/rabbitmq/log/:/var/log/rabbitmq
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "5672" ]
      interval: 5s
      timeout: 15s
      retries: 1
    # enabled_plugins host file must list both explicitly (replaces the image's
    # baked-in default, doesn't merge with it):
    #   [rabbitmq_management,rabbitmq_prometheus].
    # exposes the prometheus plugin on :15692 for prometheus's "rabbitmq" scrape job

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    networks:
      - default
    pull_policy: missing
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${APP_TIMEZONE}
      - "WATCHTOWER_SCHEDULE=0 0 4 * * *"
      - "WATCHTOWER_CLEANUP=true"
      - "WATCHTOWER_TIMEOUT=5m"
      - "WATCHTOWER_LABEL_ENABLE=true"
      - "WATCHTOWER_NOTIFICATION_URL=pushover://:${PUSHOVER_TOKEN}@${PUSHOVER_USER}/?"

  dupeguru:
    image: jlesage/dupeguru:latest
    container_name: dupeguru
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.dupeguru-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.dupeguru.rule=Host(`dupeguru.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.dupeguru.entrypoints=web"
      - "traefik.http.routers.dupeguru.middlewares=dupeguru-https-redirect"
      - "traefik.http.routers.dupeguru-secure.rule=Host(`dupeguru.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.dupeguru-secure.entrypoints=web-secure"
      - "traefik.http.routers.dupeguru-secure.tls=true"
      - "traefik.http.routers.dupeguru-secure.tls.certresolver=stepca"
    ports:
      - ${NETWORK_INTERFACE}:5800:5800/tcp
    volumes:
      - /mnt/fastpool/system/processes/dupeguru:/config:rw
      - /mnt/fastpool/system/processes/nextcloud:/storage:rw

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    runtime: nvidia
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 2m
    group_add:
      - "910"   # nas_multimedia
      - "930"   # nas_extras
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.tdarr-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.tdarr.rule=Host(`tdarr.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.tdarr.entrypoints=web"
      - "traefik.http.routers.tdarr.middlewares=tdarr-https-redirect"
      - "traefik.http.routers.tdarr-secure.rule=Host(`tdarr.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.tdarr-secure.entrypoints=web-secure"
      - "traefik.http.routers.tdarr-secure.tls=true"
      - "traefik.http.routers.tdarr-secure.tls.certresolver=stepca"
      - "traefik.http.services.tdarr.loadbalancer.server.port=8265"
    ports:
      - ${NETWORK_INTERFACE}:9921:8265/tcp   # webUI
      - ${NETWORK_INTERFACE}:9922:8266/tcp   # server (needed if you add external nodes later)
    environment:
      - TZ=${APP_TIMEZONE}
      - PUID=${APP_USER_FILEFLOWS}
      - PGID=${APP_GROUP_FILEFLOWS}
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=MainNode
      - auth=false
      - openBrowser=false
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /mnt/fastpool/system/processes/tdarr/custom-cont-init.d:/custom-cont-init.d
      - /mnt/fastpool/system/processes/tdarr/server:/app/server
      - /mnt/fastpool/system/processes/tdarr/configs:/app/configs
      - /mnt/fastpool/system/processes/tdarr/logs:/app/logs
      - /mnt/fastpool/system/processes/tdarr/temp:/temp
      - /mnt/fastpool/system/processes/tdarr/cache:/media/transcoding
      - /mnt/leftpool/extras:/media/extras
      - /mnt/rightpool/movies:/media/movies
      - /mnt/rightpool/series:/media/series

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    runtime: nvidia
    user: ${APP_USER}:${APP_GROUP}
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /mnt/fastpool/system/processes/ollama:/ollama
    environment:
      - TZ=${APP_TIMEZONE}
      - HOME=/ollama
      - OLLAMA_KEEP_ALIVE=2m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mem0-mcp:
    image: python:3.12-slim
    container_name: mem0-mcp
    user: ${APP_USER}:${APP_GROUP}
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      - postgres
      - ollama
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.mem0-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.mem0.rule=Host(`mem0.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.mem0.entrypoints=web"
      - "traefik.http.routers.mem0.middlewares=mem0-https-redirect"
      - "traefik.http.routers.mem0-secure.rule=Host(`mem0.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.mem0-secure.entrypoints=web-secure"
      - "traefik.http.routers.mem0-secure.tls=true"
      - "traefik.http.routers.mem0-secure.tls.certresolver=stepca"
      - "traefik.http.services.mem0.loadbalancer.server.port=8000"
    ports:
      - ${NETWORK_INTERFACE}:8765:8000/tcp
    secrets:
      - mem0-postgres-password
      - mem0-requesty-api-key
      - mem0-mcp-tokens
    volumes:
      - /mnt/fastpool/system/processes/mem0/app:/app:ro
      - /mnt/fastpool/system/processes/mem0/data:/data
    command: ["sh", "/app/start.sh"]
    environment:
      - TZ=${APP_TIMEZONE}
      - HOME=/data
      - MEM0_DIR=/data/mem0
      - MEM0_TELEMETRY=False
      - MEM0_UPDATE_CHECK_AT=04:30   # keep after WATCHTOWER_SCHEDULE (04:00)
      - MEM0_LLM_MODEL=mistral/mistral-small-2603
      - MEM0_LLM_BASE_URL=https://router.requesty.ai/v1
      - MEM0_LLM_API_KEY_FILE=/run/secrets/mem0-requesty-api-key
      - MEM0_EMBED_MODEL=embeddinggemma
      - MEM0_EMBED_BASE_URL=http://ollama:11434/v1
      - MEM0_EMBED_DIMS=768   # must match the embed model; changing it needs a new collection
      - MEM0_PG_HOST=postgres
      - MEM0_PG_PORT=5432
      - MEM0_PG_DB=mem0
      - MEM0_PG_USER=mem0
      - MEM0_PG_PASSWORD_FILE=/run/secrets/mem0-postgres-password
      - MEM0_TOKENS_FILE=/run/secrets/mem0-mcp-tokens
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    deploy:
      resources:
        limits:
          memory: 1000M

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    user: ${APP_USER}:${APP_GROUP}
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.searxng-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.searxng.rule=Host(`searxng.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.searxng.entrypoints=web"
      - "traefik.http.routers.searxng.middlewares=searxng-https-redirect"
      - "traefik.http.routers.searxng-secure.rule=Host(`searxng.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.searxng-secure.entrypoints=web-secure"
      - "traefik.http.routers.searxng-secure.tls=true"
      - "traefik.http.routers.searxng-secure.tls.certresolver=stepca"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    ports:
      - ${NETWORK_INTERFACE}:8888:8080/tcp
    volumes:
      - /mnt/fastpool/system/processes/searxng/config:/etc/searxng
      - /mnt/fastpool/system/processes/searxng/cache:/var/cache/searxng
    environment:
      - TZ=${APP_TIMEZONE}
      - SEARXNG_BASE_URL=https://searxng.${NETWORK_DOMAIN}/
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

secrets:
  postgres-pass:
    file: /mnt/fastpool/system/processes/secrets/postgres-pass.txt
  mem0-postgres-password:
    file: /mnt/fastpool/system/processes/secrets/mem0-postgres-password.txt
  mem0-requesty-api-key:
    file: /mnt/fastpool/system/processes/secrets/mem0-requesty-api-key.txt
  mem0-mcp-tokens:
    file: /mnt/fastpool/system/processes/secrets/mem0-mcp-tokens.txt
