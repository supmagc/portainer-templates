# ---------------------------------------------------------------------------
# Recreating this stack from scratch
# ---------------------------------------------------------------------------
#
# 1. First deploy is a TWO-STEP process, because Compose resolves every
#    active service's image up front (regardless of depends_on ordering) —
#    so nextcloud/cron/web must not be "active" yet the very first time,
#    or Compose fails immediately with "No such image: nextcloud-local:...".
#      a) Deploy/update the stack in Portainer WITHOUT any COMPOSE_PROFILES
#         env var set (or leave it unset/empty). Only `rebuilder` (and
#         `onlyoffice`, which is unrelated) will start — nextcloud/cron/web
#         are gated behind the "app" profile and Compose skips them
#         entirely, so there's nothing to fail on.
#      b) Watch `docker logs -f nextcloud-rebuilder` until it reports the
#         image built successfully (a few minutes — it builds with its own
#         docker CLI + buildx over the mounted docker.sock, never through
#         Portainer's bundled compose engine, so this also sidesteps
#         environments where that engine lacks the buildx plugin).
#      c) Add an environment variable `COMPOSE_PROFILES=app` to this stack
#         in Portainer and deploy/update again. The image now exists, so
#         nextcloud/cron/web start normally. Leave COMPOSE_PROFILES=app set
#         permanently after this — all future redeploys are single-step.
#
# 2. Only needed on a truly fresh instance (new config.php, not restored from
#    prior storage) — these two are otherwise already set and persisted at
#    /mnt/fastpool/system/nextcloud/app/html:
#      docker exec -u www-data nextcloud php occ config:system:set preview_imaginary_url --value=""
#      docker exec -u www-data nextcloud php occ config:system:set memcache.local --value="\OC\Memcache\APCu"
# ---------------------------------------------------------------------------

version: "3.3"

name: nextcloud

networks:
  default:
    driver: bridge
  utilities_default:
    external: true

services:
  nextcloud:
    image: "nextcloud-local:fpm-alpine"
    container_name: "nextcloud"
    user: "${APP_USER}:${APP_GROUP}"
    profiles:
      - app
    networks:
      - default
      - utilities_default
    pull_policy: never
    restart: always
    depends_on:
      rebuilder:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    secrets:
      - nextcloud-mariadb-host
      - nextcloud-mariadb-database
      - nextcloud-mariadb-user
      - nextcloud-mariadb-password
      - nextcloud-admin-user
      - nextcloud-admin-password
    volumes:
      - "/dev/dri:/dev/dri"
      - "/mnt/leftpool/nextcloud:/var/www/html/data:z"
      - "/mnt/fastpool/system/nextcloud/app/html:/var/www/html:z"
      - "/mnt/fastpool/system/nextcloud/app/redis-session.ini:/usr/local/etc/php/conf.d/redis-session.ini:z"
      - "/mnt/fastpool/system/nextcloud/app/apcu.ini:/usr/local/etc/php/conf.d/zz-apcu.ini:z,ro"
    environment:
      - "MYSQL_DATABASE_FILE=/run/secrets/nextcloud-mariadb-database"
      - "MYSQL_HOST_FILE=/run/secrets/nextcloud-mariadb-host"
      - "MYSQL_USER_FILE=/run/secrets/nextcloud-mariadb-user"
      - "MYSQL_PASSWORD_FILE=/run/secrets/nextcloud-mariadb-password"
      - "NEXTCLOUD_ADMIN_USER_FILE=/run/secrets/nextcloud-admin-user"
      - "NEXTCLOUD_ADMIN_PASSWORD_FILE=/run/secrets/nextcloud-admin-password"
      - "NEXTCLOUD_TRUSTED_DOMAINS=${NETWORK_INTERFACE}:5659 nextcloud.bellecerise.local nextcloud-web"
      - "REDIS_HOST=redis"
      - "REDIS_HOST_PORT=6379"
      - "PHP_MEMORY_LIMIT=512M"
      - "PHP_UPLOAD_LIMIT=16G"
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep php-fpm && nc -z 127.0.0.1 9000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cron:
    image: "nextcloud-local:fpm-alpine"
    container_name: "nextcloud-cron"
    profiles:
      - app
    networks:
      - default
      - utilities_default
    pull_policy: never
    restart: always
    depends_on:
      nextcloud:
        condition: service_started
      rebuilder:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - "/mnt/leftpool/nextcloud:/var/www/html/data:z"
      - "/mnt/fastpool/system/nextcloud/app/html:/var/www/html:z"
      - "/mnt/fastpool/system/nextcloud/app/redis-session.ini:/usr/local/etc/php/conf.d/redis-session.ini:z,ro"
      - "/mnt/fastpool/system/nextcloud/app/apcu.ini:/usr/local/etc/php/conf.d/zz-apcu.ini:z,ro"
      - "/mnt/fastpool/system/nextcloud/app/cron.sh:/cron-custom.sh:ro"
    environment:
      - "UID=${APP_USER}"
      - "GID=${APP_GROUP}"
      - "REDIS_HOST=redis"
      - "REDIS_HOST_PORT=6379"
    entrypoint: /cron-custom.sh
    healthcheck:
      test: ["CMD", "pgrep", "-f", "crond"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: caddy:2.8.4
    container_name: nextcloud-web
    user: "${APP_USER}:${APP_GROUP}"
    profiles:
      - app
    networks:
      - default
    pull_policy: missing
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.nextcloud-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.nextcloud-web.rule=Host(`${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.nextcloud-web.entrypoints=web"
      - "traefik.http.routers.nextcloud-web.middlewares=nextcloud-https-redirect"
      - "traefik.http.routers.nextcloud-web-secure.rule=Host(`${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.nextcloud-web-secure.entrypoints=web-secure"
      - "traefik.http.routers.nextcloud-web-secure.tls=true"
      - "traefik.http.routers.nextcloud-web-secure.tls.certresolver=stepca"
    depends_on:
      nextcloud:
        condition: service_healthy
    ports:
      - "${NETWORK_INTERFACE}:5659:80"
    volumes:
      - /mnt/fastpool/system/nextcloud/caddy/Caddyfile:/etc/caddy/Caddyfile
      - /mnt/fastpool/system/nextcloud/caddy/data:/data
      - /mnt/fastpool/system/nextcloud/caddy/config:/config
      - /mnt/fastpool/system/nextcloud/app/html:/var/www/html:z,ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "127.0.0.1:2019/metrics"]
      interval: 10s
      retries: 3
      start_period: 5s
      timeout: 5s

  onlyoffice:
    container_name: onlyoffice
    image: onlyoffice/documentserver:latest
    networks:
      - default
      - utilities_default
    pull_policy: missing
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.onlyoffice-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.onlyoffice.rule=Host(`onlyoffice.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.onlyoffice.entrypoints=web"
      - "traefik.http.routers.onlyoffice.middlewares=onlyoffice-https-redirect"
      - "traefik.http.routers.onlyoffice-secure.rule=Host(`onlyoffice.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.onlyoffice-secure.entrypoints=web-secure"
      - "traefik.http.routers.onlyoffice-secure.tls=true"
      - "traefik.http.routers.onlyoffice-secure.tls.certresolver=stepca"
    ports:
      - '${NETWORK_INTERFACE}:5658:80'
    volumes:
      - /mnt/fastpool/system/nextcloud/onlyoffice/data:/var/lib/onlyoffice
      - /mnt/fastpool/system/nextcloud/onlyoffice/log:/var/log/onlyoffice
    environment:
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - ONLYOFFICE_HTTPS_HSTS_ENABLED=false
      - USE_UNAUTHORIZED_STORAGE=true
      - AMQP_URI=amqp://${ONLYOFFICE_AMQP_USER}:${ONLYOFFICE_AMQP_PASS}@rabbitmq:5672
      - REDIS_SERVER_HOST=redis
      - REDIS_SERVER_PORT=6379
      - DB_TYPE=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=${ONLYOFFICE_DB_USER}
      - DB_PWD=${ONLYOFFICE_DB_PASS}
      - DB_NAME=onlyoffice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  rebuilder:
    image: docker:cli
    container_name: nextcloud-rebuilder
    restart: always
    environment:
      - CHECK_INTERVAL=21600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/fastpool/system/processes/portainer/compose:/portainer-compose:ro
    working_dir: /stack
    entrypoint: sh
    command:
      - -c
      - |
        set -eu
        apk add --no-cache docker-cli-buildx docker-cli-compose >/dev/null

        BASE_IMAGE=nextcloud:fpm-alpine
        IMAGE_TAG=nextcloud-local:fpm-alpine
        STATE_FILE=/tmp/.nextcloud-base-digest

        # --- Locate this stack's compose file at runtime ---
        STACK_FILE=$$(grep -l "container_name: nextcloud-rebuilder" /portainer-compose/*/docker-compose.yml 2>/dev/null | head -n1)
        if [ -z "$$STACK_FILE" ]; then
          echo "$(date -Iseconds) ERROR: could not locate this stack's docker-compose.yml under /portainer-compose"
          exit 1
        fi
        STACK_DIR=$$(dirname "$$STACK_FILE")
        echo "$(date -Iseconds) resolved stack directory: $$STACK_DIR"

        ENV_ARGS=""
        if [ -f "$$STACK_DIR/stack.env" ]; then
          ENV_ARGS="--env-file $$STACK_DIR/stack.env"
        fi
        COMPOSE="docker compose -f $$STACK_FILE $$ENV_ARGS"

        printf '%s' 'FROM nextcloud:fpm-alpine
        RUN set -ex; \
            apk add --no-cache \
                ffmpeg \
                imagemagick \
                procps \
                samba-client \
                exiftool \
            ;
        ADD --link https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions /usr/local/bin/
        RUN chmod +x /usr/local/bin/install-php-extensions && \
            install-php-extensions bz2 imap smbclient
        ENV NEXTCLOUD_UPDATE=1
        ' > /tmp/Dockerfile

        build_image() {
          echo "$(date -Iseconds) building $$IMAGE_TAG"
          docker build --pull -f /tmp/Dockerfile -t "$$IMAGE_TAG" /tmp
        }

        if ! docker image inspect "$$IMAGE_TAG" >/dev/null 2>&1; then
          echo "$(date -Iseconds) no local image yet, building for the first time"
          build_image
          docker buildx imagetools inspect "$$BASE_IMAGE" 2>/dev/null \
            | awk '/^Digest:/{print $2; exit}' > "$$STATE_FILE"
        fi

        while true; do
          remote_digest=$(docker buildx imagetools inspect "$$BASE_IMAGE" 2>/dev/null \
            | awk '/^Digest:/{print $2; exit}')
          last_digest=$(cat "$$STATE_FILE" 2>/dev/null || echo "")

          if [ -n "$$remote_digest" ] && [ "$$remote_digest" != "$$last_digest" ]; then
            echo "$(date -Iseconds) base image changed ($$last_digest -> $$remote_digest), rebuilding"
            if build_image; then
              $$COMPOSE up -d --no-deps nextcloud cron
              echo "$$remote_digest" > "$$STATE_FILE"
            else
              echo "$(date -Iseconds) build failed, will retry next cycle"
            fi
          else
            echo "$(date -Iseconds) no change ($$remote_digest)"
          fi

          sleep "$$CHECK_INTERVAL"
        done
    healthcheck:
      test: ["CMD", "docker", "image", "inspect", "nextcloud-local:fpm-alpine"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s

secrets:
  nextcloud-mariadb-host:
    file: /mnt/fastpool/system/processes/secrets/nextcloud-mariadb-host.txt
  nextcloud-mariadb-database:
    file: /mnt/fastpool/system/processes/secrets/nextcloud-mariadb-database.txt
  nextcloud-mariadb-user:
    file: /mnt/fastpool/system/processes/secrets/nextcloud-mariadb-user.txt
  nextcloud-mariadb-password:
    file: /mnt/fastpool/system/processes/secrets/nextcloud-mariadb-password.txt
  nextcloud-admin-user:
    file: /mnt/fastpool/system/processes/secrets/nextcloud-admin-user.txt
  nextcloud-admin-password:
    file: /mnt/fastpool/system/processes/secrets/nextcloud-admin-password.txt