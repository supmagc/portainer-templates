version: "3.3"

name: utilities

networks:
  default:
    driver: bridge

services:
  flaresolverr:
    image: "flaresolverr/flaresolverr:latest"
    container_name: flaresolverr
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${APP_TIMEZONE}

  chromedp:
    image: chromedp/headless-shell:latest
    container_name: chromedp
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - TZ=${APP_TIMEZONE}
      - CHROMEDP_DISABLE_GPU=true
      - CHROMEDP_DISABLE_DEV_SHM=false
      - CHROMEDP_DISABLE_SANDBOX=true
      - CHROMEDP_DISABLE_XVFB=false
      - CHROMEDP_ENABLE_HEADLESS=true
      - CHROMEDP_ENABLE_NO_SANDBOX=true
      - CHROMEDP_ENABLE_XVFB=false

  mariadb:
    image: mariadb:lts
    container_name: mariadb
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    user: ${APP_USER}:${APP_GROUP}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - ${NETWORK_INTERFACE}:3306:3306/tcp
    volumes:
      - /mnt/fastpool/system/processes/mariadb:/var/lib/mysql:Z
    environment:
      - TZ=${APP_TIMEZONE}
      - PGID=${APP_USER}
      - PUID=${APP_GROUP}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    command:
      - --innodb-buffer-pool-size=1G
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --event-scheduler=ON
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  mariadb-backup:
    image: databack/mysql-backup:latest
    container_name: mariadb-backup
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    user: ${APP_USER_BACKUP}:${APP_GROUP_BACKUP}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    secrets:
      - mariadb-backup-pass
    volumes:
      - /mnt/rightpool/backup/automated/mariadb:/backup
    environment:
      DB_SERVER: mariadb
      DB_PORT: 3306
      DB_USER: backup
      DB_PASS_FILE: /run/secrets/mariadb-backup-pass
      DB_DUMP_INCLUDE: digikam,nextcloud,onlyoffice
      #DB_DUMP_ONCE: true
      DB_DUMP_CRON: "0 4 * * *"
      DB_DUMP_RETENTION: 7d
      DB_DUMP_TARGET: /backup
      TZ: ${APP_TIMEZONE}
    command: dump

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.rule=Host(`phpmyadmin.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.phpmyadmin.entrypoints=web"
    ports:
      - ${NETWORK_INTERFACE}:3307:80/tcp
    environment:
      - PMA_HOST=mariadb
      - PMA_PMADB=pmadb
      - PMA_ARBITRARY=0

  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning ping | grep PONG"]
      start_period: 10s
      interval: 30s
      retries: 3
      timeout: 3s

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
    ports:
      - ${NETWORK_INTERFACE}:15672:15672/tcp
    volumes:
      - /mnt/fastpool/system/processes/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - /mnt/fastpool/system/processes/rabbitmq/data/:/var/lib/rabbitmq/
      - /mnt/fastpool/system/processes/rabbitmq/log/:/var/log/rabbitmq
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "5672" ]
      interval: 5s
      timeout: 15s
      retries: 1

  dupeguru:
    image: jlesage/dupeguru:latest
    container_name: dupeguru
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.dupeguru.rule=Host(`dupeguru.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.dupeguru.entrypoints=web"
    ports:
      - ${NETWORK_INTERFACE}:5800:5800/tcp
    volumes:
      - /mnt/fastpool/system/processes/dupeguru:/config:rw
      - /mnt/fastpool/system/processes/nextcloud:/storage:rw
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    networks:
      - default
    pull_policy: missing
    restart: unless-stopped
    group_add:
      - "910"   # nas_multimedia
      - "930"   # nas_extras
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.tdarr.rule=Host(`tdarr.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.tdarr.entrypoints=web"
      - "traefik.http.services.tdarr.loadbalancer.server.port=8265"
    ports:
      - ${NETWORK_INTERFACE}:9921:8265/tcp   # webUI
      - ${NETWORK_INTERFACE}:9922:8266/tcp   # server (needed if you add external nodes later)
    environment:
      - TZ=${APP_TIMEZONE}
      - PUID=${APP_USER_FILEFLOWS}
      - PGID=${APP_GROUP_FILEFLOWS}
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=MainNode
      - auth=false
      - openBrowser=false
    volumes:
      - /mnt/fastpool/system/processes/tdarr/custom-cont-init.d:/custom-cont-init.d
      - /mnt/fastpool/system/processes/tdarr/server:/app/server
      - /mnt/fastpool/system/processes/tdarr/configs:/app/configs
      - /mnt/fastpool/system/processes/tdarr/logs:/app/logs
      - /mnt/fastpool/system/processes/tdarr/temp:/temp
      - /mnt/fastpool/cache/tdarr:/cache
      - /mnt/leftpool/extras:/media/extras
      - /mnt/rightpool/movies:/media/movies
      - /mnt/rightpool/series:/media/series

secrets:
  mariadb-backup-pass:
    file: /mnt/fastpool/system/processes/secrets/mariadb-backup-pass.txt
