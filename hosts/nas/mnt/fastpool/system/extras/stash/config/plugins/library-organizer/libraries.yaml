base_path: /data
poster_crop_x: 0.5   # 0 = left, 1 = right edge of the screenshot for the 2:3 poster crop

whisparr:
  enabled: false
  version: 2
  url: http://whisparr:6969
  api_key: "{{WHISPARR_API_KEY}}"

libraries:
