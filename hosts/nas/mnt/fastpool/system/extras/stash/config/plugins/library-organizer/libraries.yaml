    path: Named
    studio_folders: true
    studio_mode: follow
    whisparr: true
  - name: Unnamed
    path: Unnamed
    studio_folders: true
    studio_mode: fixed
    studios:
    - GoddessAlexandraSnow: Goddess Alexandra Snow
    - HotKinkyJo: Hot Kinky Jo
    - LadyPerse: Lady Perse
    - PalaceOfSin: Palace of Sin
    - TriciaFox: Tricia Fox
  - name: Tubes
    path: Tubes
    studio_folders: true
    studio_mode: fixed
    studios: 
    - HypnoTube: HypnoTube
