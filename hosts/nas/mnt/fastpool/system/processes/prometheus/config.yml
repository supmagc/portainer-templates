global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: home-nas

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  - job_name: node
    scrape_interval: 15s
    static_configs: [{targets: ["192.168.1.101:9100"], labels: {instance: "nas"}}]

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs: [{targets: ["cadvisor:8080"]}]

  - job_name: rabbitmq
    scrape_interval: 30s
    static_configs: [{targets: ["rabbitmq:15692"]}]

  - job_name: traefik
    scrape_interval: 30s
    static_configs: [{targets: ["traefik:8082"]}]

  - job_name: traefik-edge
    scrape_interval: 30s
    static_configs: [{targets: ["traefik-edge:8082"]}]

  - job_name: redis
    scrape_interval: 30s
    static_configs: [{targets: ["redis-exporter:9121"]}]

  - job_name: mysqld
    scrape_interval: 30s
    static_configs: [{targets: ["mysqld-exporter:9104"]}]

  - job_name: postgres
    scrape_interval: 30s
    static_configs: [{targets: ["postgres-exporter:9187"]}]

  - job_name: dagu
    scrape_interval: 30s
    metrics_path: /api/v1/metrics
    static_configs: [{targets: ["dagu:8080"]}]

  - job_name: nextcloud
    scrape_interval: 60s
    static_configs: [{targets: ["nextcloud-exporter:9205"]}]   # VERIFY default port

  - job_name: emby
    scrape_interval: 60s
    static_configs: [{targets: ["emby-exporter:9162"]}]

  - job_name: jellyfin
    scrape_interval: 60s
    static_configs: [{targets: ["jellyfin-exporter:9594"]}]

  - job_name: navidrome
    scrape_interval: 60s
    static_configs: [{targets: ["navidrome:4533"]}]

  - job_name: sabnzbd
    scrape_interval: 60s
    static_configs: [{targets: ["sabnzbd-exporter:9387"]}]

  - job_name: qbittorrent
    scrape_interval: 60s
    static_configs: [{targets: ["qbittorrent-exporter:8000"]}]

  - job_name: bitmagnet
    scrape_interval: 30s
    static_configs: [{targets: ["bitmagnet:3333"]}]   # native /metrics (http_server 'prometheus' component)

  - job_name: exportarr
    scrape_interval: 60s
    static_configs:
      - targets: ["exportarr-sonarr:8081"]
        labels: {app: sonarr}
      - targets: ["exportarr-radarr:8081"]
        labels: {app: radarr}
      - targets: ["exportarr-lidarr:8081"]
        labels: {app: lidarr}
      - targets: ["exportarr-bazarr:8081"]
        labels: {app: bazarr}
      - targets: ["exportarr-prowlarr:8081"]
        labels: {app: prowlarr}

  - job_name: blackbox-http
    metrics_path: /probe
    params: {module: [http_2xx]}
    scrape_interval: 30s
    static_configs:
      - targets:
          - http://emby:8096/emby/System/Info/Public
          - http://jellyfin:8096/health
          - http://rabbitmq:15672/
          - http://seerr:5055/api/v1/status
          - http://openhabian.bellecerise.local:8080/rest
          - http://openhabian.bellecerise.local:3000/api/health
          - http://openhabian.bellecerise.local:8086/ping
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox-exporter:9115}

  - job_name: blackbox-http-redirect
    metrics_path: /probe
    params: {module: [http_2xx_redirect]}
    scrape_interval: 30s
    static_configs:
      - targets: ["http://nextcloud-web/"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox-exporter:9115}

  - job_name: blackbox-https
    metrics_path: /probe
    params: {module: [http_2xx_insecure]}
    scrape_interval: 30s
    static_configs:
      - targets: ["https://step-ca:9000/health"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox-exporter:9115}

  - job_name: blackbox-tls-cert
    metrics_path: /probe
    params: {module: [tls_connect]}
    scrape_interval: 5m
    static_configs:
      - targets:
          - nas:443
          - openwrt:443
          - step-ca:9000
          - openhabian.bellecerise.local:443
          - grafana.openhabian.bellecerise.local:443
          - influx.openhabian.bellecerise.local:443
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox-exporter:9115}

  - job_name: blackbox-icmp
    metrics_path: /probe
    params: {module: [icmp]}
    scrape_interval: 30s
    static_configs:
      # OpenWrt - one IP per VLAN interface (a single dead VLAN shows as one
      # target down while the others stay green)
      - targets: ["192.168.1.1"]
        labels: {role: router, name: openwrt, vlan: lan}
      - targets: ["192.168.0.1"]
        labels: {role: router, name: openwrt, vlan: admin}
      - targets: ["192.168.2.1"]
        labels: {role: router, name: openwrt, vlan: guest}
      - targets: ["192.168.3.1"]
        labels: {role: router, name: openwrt, vlan: work}
      # NAS - one IP per service interface
      - targets: ["192.168.1.101"]
        labels: {role: nas, name: nas, iface: main}
      - targets: ["192.168.1.110"]
        labels: {role: nas, name: nas, iface: docker}
      - targets: ["192.168.1.111"]
        labels: {role: nas, name: nas, iface: nfs}
      - targets: ["192.168.1.112"]
        labels: {role: nas, name: nas, iface: edge}
      # switch + APs (also SNMP-scraped; ICMP is the cheap independent signal)
      - targets: ["192.168.0.2"]
        labels: {role: switch, name: jetstream}
      - targets: ["192.168.0.3"]
        labels: {role: ap, name: eap1}
      - targets: ["192.168.0.4"]
        labels: {role: ap, name: eap2}
      - targets: ["192.168.0.5"]
        labels: {role: ap, name: eap3}
      # openHABian Pi + the field-bus devices openHAB talks to
      - targets: ["192.168.1.154"]
        labels: {role: host, name: openhabian}
      - targets: ["192.168.1.150"]
        labels: {role: field-device, name: wago-modbus}
      - targets: ["192.168.1.151"]
        labels: {role: field-device, name: entec-dmx}
      - targets: ["192.168.1.153"]
        labels: {role: field-device, name: onewire}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox-exporter:9115}

  - job_name: blackbox-traefik-http
    metrics_path: /probe
    params: {module: [http_2xx_redirect]}
    scrape_interval: 30s
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/traefik-http.json"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox-exporter:9115}

  - job_name: blackbox-traefik-https
    metrics_path: /probe
    params: {module: [http_2xx_insecure]}
    scrape_interval: 30s
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/traefik-https.json"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox-exporter:9115}

  - job_name: blackbox-traefik-tls-cert
    metrics_path: /probe
    params: {module: [tls_connect]}
    scrape_interval: 5m
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/traefik-tls-cert.json"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox-exporter:9115}

  - job_name: openhabian-grafana
    scrape_interval: 60s
    static_configs: [{targets: ["openhabian.bellecerise.local:3000"]}]

  - job_name: snmp-switch
    scrape_interval: 60s
    scrape_timeout: 55s
    metrics_path: /snmp
    params: {module: [if_mib], auth: [public_v2_switch]}
    static_configs:
      - targets: ["192.168.0.2"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: snmp-exporter:9116}

  - job_name: snmp-ap
    scrape_interval: 60s
    scrape_timeout: 55s
    metrics_path: /snmp
    params: {module: [if_mib], auth: [public_v2_ap]}
    static_configs:
      - targets: ["192.168.0.3", "192.168.0.4", "192.168.0.5"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: snmp-exporter:9116}

  - job_name: smartctl
    scrape_interval: 5m
    static_configs: [{targets: ["smartctl-exporter:9633"]}]

  - job_name: gpu
    scrape_interval: 30s
    static_configs: [{targets: ["gpu-exporter:9835"]}]

  - job_name: openwrt
    scrape_interval: 30s
    static_configs: [{targets: ["192.168.1.1:9100"]}]

  - job_name: openhabian
    scrape_interval: 30s
    static_configs: [{targets: ["openhabian.bellecerise.local:9100"]}]
