apiVersion: 1

groups:
  - orgId: 1
    name: home-alerts-default
    folder: Alerts
    interval: 1m
    rules:
      - uid: target-down
        title: TargetDown
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: up
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target down"
          description: "Scrape target {{ $labels.instance }} (job={{ $labels.job }}) has been down for 5+ minutes."

      - uid: container-crash-looping
        title: ContainerCrashLooping
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: changes(container_start_time_seconds{name!=""}[15m])
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [2]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting repeatedly"
          description: "Container {{ $labels.name }} has restarted {{ $values.B.Value }} times in the last 15 minutes."

      - uid: container-unhealthy
        title: ContainerUnhealthy
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: container_health_state{name!=""} >= 0
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is unhealthy"
          description: "Container {{ $labels.name }} (image {{ $labels.image }}) has had a failing Docker healthcheck for 10+ minutes — cAdvisor reports container_health_state=0 (unhealthy, or stuck in 'starting'). It won't necessarily restart on its own, so ContainerCrashLooping won't catch it — check the container's healthcheck and logs."

      - uid: disk-space-low
        title: DiskSpaceLow
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"}) * 100
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [15]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $values.B.Value }}% free space left."

      - uid: disk-space-critical
        title: DiskSpaceCritical
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"}) * 100
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [5]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $values.B.Value }}% free space left — act now."

      - uid: probe-failing
        title: ProbeFailing
        condition: C
        for: 3m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: probe_success
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} unreachable"
          description: "Blackbox probe against {{ $labels.instance }} (job={{ $labels.job }}) has been failing for 3+ minutes."

      - uid: pool-space-low
        title: PoolSpaceLow
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: zpool_capacity_percent
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [85]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Pool {{ $labels.pool }} is {{ $values.B.Value }}% full"
          description: "ZFS pool {{ $labels.pool }} has been above 85% capacity for 10+ minutes."

      - uid: pool-space-critical
        title: PoolSpaceCritical
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: zpool_capacity_percent
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [95]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Pool {{ $labels.pool }} is {{ $values.B.Value }}% full — act now"
          description: "ZFS pool {{ $labels.pool }} has been above 95% capacity for 5+ minutes."

      - uid: disk-smart-failure
        title: DiskSmartFailure
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: smartctl_device_smart_status
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "SMART failure on {{ $labels.device }}"
          description: "Disk {{ $labels.device }} on {{ $labels.instance }} is reporting a failed SMART overall-health status. Back it up / replace it."

      - uid: disk-temperature-high
        title: DiskTemperatureHigh
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: smartctl_device_temperature{temperature_type="current"}
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [55]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} running hot ({{ $values.B.Value }}°C)"
          description: "Disk {{ $labels.device }} on {{ $labels.instance }} has been above 55°C for 10+ minutes. Check airflow/dust."

      - uid: pool-degraded
        title: PoolDegraded
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: zpool_health
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Pool {{ $labels.pool }} is not ONLINE"
          description: "ZFS pool {{ $labels.pool }} is DEGRADED/FAULTED/OFFLINE/UNAVAIL/REMOVED - check `zpool status {{ $labels.pool }}` now."

      - uid: scheduled-job-stale
        title: ScheduledJobStale
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: (time() - scheduled_job_last_run_timestamp_seconds) - scheduled_job_expected_interval_seconds and scheduled_job_enabled == 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job {{ $labels.source }}/{{ $labels.name }} hasn't run on time"
          description: "{{ $labels.source }}/{{ $labels.name }} is {{ $values.B.Value }}s overdue against its expected interval - check the underlying scheduler (TrueNAS Cron Jobs / Data Protection task / systemd timer, depending on {{ $labels.source }})."

      - uid: scheduled-job-failed
        title: ScheduledJobFailed
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: scheduled_job_last_exit_code and scheduled_job_enabled == 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job {{ $labels.source }}/{{ $labels.name }} failed"
          description: "{{ $labels.source }}/{{ $labels.name }}'s last run did not succeed - check its row on the NAS Overview \"Scheduled Jobs\" table (nas-* sources) or `systemctl status {{ $labels.name }}` on the Pi (openhabian-* sources)."

      - uid: dagu-scheduler-down
        title: DaguSchedulerDown
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: dagu_scheduler_running
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Dagu scheduler is not running"
          description: "dagu_scheduler_running has been 0 for 5+ minutes - no Dagu DAG will fire on its cron schedule until this recovers. Check the dagu container logs."

      - uid: dagu-dag-run-failed
        title: DaguDagRunFailed
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: dagu_dag_runs_total_by_dag{status="failed"}
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Dagu DAG {{ $labels.dag }} failed"
          description: "{{ $labels.dag }} has {{ $values.B.Value }} failed run(s) today - check its history in the Dagu UI."

      - uid: cert-expiring-soon
        title: CertExpiringSoon
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: (probe_ssl_earliest_cert_expiry{job=~".*tls-cert", instance!~".*step-ca:9000.*"} - time()) / 86400
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [7]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Cert for {{ $labels.instance }} expires in {{ $values.B.Value }} days"
          description: "TLS cert served by {{ $labels.instance }} has less than 7 days left - check the acme.sh renewal cron on the relevant host."

      - uid: router-packet-cost-high
        title: RouterPacketCostHigh
        condition: C
        for: 3h
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 21600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: 1e6 * sum(rate(node_cpu_seconds_total{job="openwrt", mode="softirq"}[6h])) / sum(rate(node_network_receive_packets_total{job="openwrt", device="eth0"}[6h]))
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                # VERIFY: ~3x the fresh-boot baseline (26-43 before flow offloading); retune once the post-offload baseline is known.
                - evaluator: {type: gt, params: [90]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Router packet cost {{ $values.B.Value }} µs/packet"
          description: "OpenWrt softirq cost per packet has been above 90 µs for 3h - throughput is degrading with uptime; a router reboot restores it (see docs/network.md)."
