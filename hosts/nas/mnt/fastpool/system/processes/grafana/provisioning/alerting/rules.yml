apiVersion: 1

groups:
  - orgId: 1
    name: home-alerts-default
    folder: Alerts
    interval: 1m
    rules:
      - uid: target-down
        title: TargetDown
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: up
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target down"
          description: "Scrape target {{ $labels.instance }} (job={{ $labels.job }}) has been down for 5+ minutes."

      - uid: container-crash-looping
        title: ContainerCrashLooping
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: changes(container_start_time_seconds{name!=""}[15m])
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [2]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting repeatedly"
          description: "Container {{ $labels.name }} has restarted {{ $values.B.Value }} times in the last 15 minutes."

      - uid: container-unhealthy
        title: ContainerUnhealthy
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: container_health_state{name!=""} >= 0
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is unhealthy"
          description: "Container {{ $labels.name }} (image {{ $labels.image }}) has had a failing Docker healthcheck for 10+ minutes — cAdvisor reports container_health_state=0 (unhealthy, or stuck in 'starting'). It won't necessarily restart on its own, so ContainerCrashLooping won't catch it — check the container's healthcheck and logs."

      - uid: disk-space-low
        title: DiskFillingUp
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              # Days until full at the 24h fill rate (huge when not shrinking); min by device collapses bind mounts of one filesystem.
              expr: >-
                min by (instance, device) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|zfs|nfs.*|vfat"}
                / clamp_min(-deriv(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|zfs|nfs.*|vfat"}[24h]), 1)) / 86400
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [7]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} on {{ $labels.instance }} full in {{ humanize $values.B.Value }} days"
          description: "At the last 24h's fill rate {{ $labels.device }} on {{ $labels.instance }} runs out of space in {{ humanize $values.B.Value }} days. DiskSpaceCritical (under 5% free) is the backstop."

      - uid: disk-space-critical
        title: DiskSpaceCritical
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"}) * 100
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [5]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $values.B.Value }}% free space left — act now."

      - uid: probe-failing
        title: ProbeFailing
        condition: C
        for: 3m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              # tls-cert jobs scrape every 5m - an 11m max_over_time needs 2+ consecutive failed probes, not one
              expr: >-
                probe_success{job!~".*tls-cert"}
                or max_over_time(probe_success{job=~".*tls-cert"}[11m])
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} unreachable"
          description: "Blackbox probe against {{ $labels.instance }} (job={{ $labels.job }}) has been failing for 3+ minutes (tls-cert jobs: 2+ consecutive 5-minute probes)."

      - uid: pool-space-low
        title: PoolFillingUp
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 1209600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              # Days until the pool reaches 90% at the 14d fill rate (huge when not growing; negative once already past 90%).
              expr: (90 - zpool_capacity_percent) / clamp_min(deriv(zpool_capacity_percent[14d]), 1e-12) / 86400
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [30]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Pool {{ $labels.pool }} reaches 90% in {{ humanize $values.B.Value }} days"
          description: "At its 14-day growth rate ZFS pool {{ $labels.pool }} reaches 90% capacity in {{ humanize $values.B.Value }} days (negative = already past it). PoolSpaceCritical (over 95%) is the backstop."

      - uid: pool-space-critical
        title: PoolSpaceCritical
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: zpool_capacity_percent
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [95]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Pool {{ $labels.pool }} is {{ $values.B.Value }}% full — act now"
          description: "ZFS pool {{ $labels.pool }} has been above 95% capacity for 5+ minutes."

      - uid: disk-smart-failure
        title: DiskSmartFailure
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                label_replace(label_replace(
                smartctl_device_smart_status * on (instance, device) group_left (model_name, serial_number) max by (instance, device, model_name, serial_number) (smartctl_device),
                "host", "nas", "instance", "smartctl-exporter.*"), "host", "openhabian", "instance", "openhabian.*")
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "SMART failure on {{ $labels.host }}/{{ $labels.device }} ({{ $labels.model_name }})"
          description: "{{ $labels.host }}/{{ $labels.device }} ({{ $labels.model_name }}, S/N {{ $labels.serial_number }}) is reporting a failed SMART overall-health status. Back it up / replace it."

      - uid: disk-temperature-high
        title: DiskTemperatureHigh
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                label_replace(label_replace(
                smartctl_device_temperature{temperature_type="current"} * on (instance, device) group_left (model_name, serial_number) max by (instance, device, model_name, serial_number) (smartctl_device),
                "host", "nas", "instance", "smartctl-exporter.*"), "host", "openhabian", "instance", "openhabian.*")
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [55]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.device }} running hot ({{ $values.B.Value }}°C)"
          description: "{{ $labels.host }}/{{ $labels.device }} ({{ $labels.model_name }}, S/N {{ $labels.serial_number }}) has been above 55°C for 10+ minutes. Check airflow/dust."

      - uid: disk-bad-sectors
        title: DiskBadSectorsGrowing
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                label_replace(label_replace(
                max by (instance, device, attribute_name) (max_over_time(smartctl_device_attribute{attribute_value_type="raw", attribute_id=~"5|197|198"}[7d]) - min_over_time(smartctl_device_attribute{attribute_value_type="raw", attribute_id=~"5|197|198"}[7d]))
                * on (instance, device) group_left (model_name, serial_number) max by (instance, device, model_name, serial_number) (smartctl_device),
                "host", "nas", "instance", "smartctl-exporter.*"), "host", "openhabian", "instance", "openhabian.*")
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                # Growth over 7d, not the absolute count: a stable count (NAS sda: 112 for 30d+) stays quiet. Adjust 9 to tune.
                - evaluator: {type: gt, params: [9]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.device }} ({{ $labels.model_name }}): {{ $labels.attribute_name }} grew by {{ $values.B.Value }} in 7d"
          description: "{{ $labels.host }}/{{ $labels.device }} ({{ $labels.model_name }}, S/N {{ $labels.serial_number }}): SMART attribute {{ $labels.attribute_name }} (raw) rose by {{ $values.B.Value }} over the last 7 days - the drive is actively losing sectors. Current value: NAS Overview 'SMART Status & Error Counts' (nas) or Home Automation 'SSD Bad Sectors' (openhabian). Back it up and plan a replacement."

      - uid: disk-bad-sectors-high
        title: DiskBadSectorsHigh
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: >-
                label_replace(label_replace(
                max by (instance, device, attribute_name) (smartctl_device_attribute{attribute_value_type="raw", attribute_id=~"5|197|198"})
                * on (instance, device) group_left (model_name, serial_number) max by (instance, device, model_name, serial_number) (smartctl_device),
                "host", "nas", "instance", "smartctl-exporter.*"), "host", "openhabian", "instance", "openhabian.*")
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                # Absolute backstop for a drive that is already bad (the NAS's 112 is below it). Adjust 500 to tune.
                - evaluator: {type: gt, params: [500]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.device }} ({{ $labels.model_name }}): {{ $labels.attribute_name }} = {{ $values.B.Value }}"
          description: "{{ $labels.host }}/{{ $labels.device }} ({{ $labels.model_name }}, S/N {{ $labels.serial_number }}) has {{ $values.B.Value }} raw {{ $labels.attribute_name }} - far past what a healthy drive shows, even if SMART still reads PASSED. Replace it."

      - uid: disk-write-sustained-high
        title: DiskWriteSustainedHigh
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 21600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: rate(node_disk_written_bytes_total{job="openhabian", device=~"mmcblk0|sd[a-z]"}[6h])
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                # Bytes/s over 6h. Pi baseline: SD ~70 KB/s, SSD was ~2 MB/s (~175 GB/day) before it died. Adjust 500000 (~43 GB/day) to tune.
                - evaluator: {type: gt, params: [500000]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "openhabian {{ $labels.device }} writing {{ humanize1024 $values.B.Value }}B/s (6h avg)"
          description: "openhabian {{ $labels.device }} has averaged {{ humanize1024 $values.B.Value }}B/s of writes over 6h - sustained writes wear out SD cards and SSDs. Find the writer (persistence strategy, logging, database) - see docs/openhabian-monitoring.md."

      - uid: disk-write-spike
        title: DiskWriteSpike
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              # Ratio of the 1h write rate to the 7d average, floored at 2 MB/s so idle devices can't spike; NVMe only (HDD writes are bursty by nature).
              expr: >-
                rate(node_disk_written_bytes_total{job="node", device=~"nvme[0-9]n1"}[1h])
                / clamp_min(avg_over_time(rate(node_disk_written_bytes_total{job="node", device=~"nvme[0-9]n1"}[1h])[7d:1h]), 2e6)
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [3]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "NAS {{ $labels.device }} writing {{ humanize $values.B.Value }}x its 7-day average"
          description: "NAS {{ $labels.device }} has written at {{ humanize $values.B.Value }}x its 7-day average rate for 30+ minutes. See NAS Overview 'ZFS Dataset Write Rate' for which dataset is responsible."

      - uid: disk-stalled
        title: DiskStalled
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              # Busy fraction, but only while throughput is under 100 KB/s: a hung/dying drive is "busy" without moving data. Healthy disks read 0.
              expr: >-
                rate(node_disk_io_time_seconds_total{device=~"mmcblk0|sd[a-z]|nvme[0-9]n[0-9]"}[10m])
                * ((rate(node_disk_read_bytes_total{device=~"mmcblk0|sd[a-z]|nvme[0-9]n[0-9]"}[10m])
                + rate(node_disk_written_bytes_total{device=~"mmcblk0|sd[a-z]|nvme[0-9]n[0-9]"}[10m])) < bool 1e5)
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0.9]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} on {{ $labels.instance }} is busy but moving no data"
          description: "{{ $labels.device }} on {{ $labels.instance }} has been >90% busy with under 100 KB/s of throughput for 10+ minutes - the signature of a hung or dying drive (the Pi SSD looked like this when it died). Check dmesg and SMART."

      - uid: cpu-iowait-high
        title: CpuIowaitHigh
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: 100 * avg by (instance) (rate(node_cpu_seconds_total{job=~"node|openhabian", mode="iowait"}[15m]))
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                # Baseline: Pi 5-11% (SD card), NAS under 7%. Adjust 25 to tune.
                - evaluator: {type: gt, params: [25]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} waiting on disk {{ humanize $values.B.Value }}% of CPU time"
          description: "iowait on {{ $labels.instance }} has averaged {{ humanize $values.B.Value }}% for 15+ minutes - processes are blocked on a slow or failing disk. Compare per-device throughput and busy time on Host Overview / DiskStalled."

      - uid: oom-kill
        title: OomKill
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: increase(node_vmstat_oom_kill{job=~"node|openhabian"}[15m])
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: {{ humanize $values.B.Value }} process(es) OOM-killed in 15m"
          description: "The kernel on {{ $labels.instance }} killed {{ humanize $values.B.Value }} process(es) for memory in the last 15 minutes. On the NAS, container_oom_events_total (Container Overview / NAS Overview 'OOM Kills') shows which container."

      - uid: pi-storage-io-errors
        title: PiStorageIoErrors
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: loki
            model:
              datasource: {type: loki, uid: loki}
              expr: sum(count_over_time({host="openhabian", job="journal"} |~ "(?i)mmcblk0.*(error|timeout)|EXT4-fs error|Buffer I/O error|blk_update_request|Remounting filesystem read-only" [10m])) or vector(0)
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Storage I/O errors in openhabian's journal ({{ $values.B.Value }} in 10m)"
          description: "The Pi's kernel logged SD card/SSD I/O or filesystem errors in the last 10 minutes. Query {host=\"openhabian\", job=\"journal\"} in Loki for the lines. The 'last error at'/'initial error at' lines ext4 prints at every mount are deliberately not matched."

      - uid: pool-degraded
        title: PoolDegraded
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: zpool_health
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Pool {{ $labels.pool }} is not ONLINE"
          description: "ZFS pool {{ $labels.pool }} is DEGRADED/FAULTED/OFFLINE/UNAVAIL/REMOVED - check `zpool status {{ $labels.pool }}` now."

      - uid: scheduled-job-stale
        title: ScheduledJobStale
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: (time() - scheduled_job_last_run_timestamp_seconds) - scheduled_job_expected_interval_seconds and scheduled_job_enabled == 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job {{ $labels.source }}/{{ $labels.name }} hasn't run on time"
          description: "{{ $labels.source }}/{{ $labels.name }} is {{ $values.B.Value }}s overdue against its expected interval - check the underlying scheduler (TrueNAS Cron Jobs / Data Protection task / systemd timer, depending on {{ $labels.source }})."

      - uid: scheduled-job-failed
        title: ScheduledJobFailed
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: scheduled_job_last_exit_code and scheduled_job_enabled == 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job {{ $labels.source }}/{{ $labels.name }} failed"
          description: "{{ $labels.source }}/{{ $labels.name }}'s last run did not succeed - check its row on the NAS Overview \"Scheduled Jobs\" table (nas-* sources) or `systemctl status {{ $labels.name }}` on the Pi (openhabian-* sources)."

      - uid: dagu-scheduler-down
        title: DaguSchedulerDown
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: dagu_scheduler_running
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Dagu scheduler is not running"
          description: "dagu_scheduler_running has been 0 for 5+ minutes - no Dagu DAG will fire on its cron schedule until this recovers. Check the dagu container logs."

      - uid: dagu-dag-run-failed
        title: DaguDagRunFailed
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              # Dagu emits no failed series for DAGs without failures - the `or 0*` zero-fills so every DAG that ran today is listed
              expr: >-
                sum by (dag) (dagu_dag_runs_total_by_dag{status="failed"})
                or 0 * sum by (dag) (dagu_dag_runs_total_by_dag)
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Dagu DAG {{ $labels.dag }} failed"
          description: "{{ $labels.dag }} has {{ $values.B.Value }} failed run(s) today - check its history in the Dagu UI."

      - uid: gpu-unavailable
        title: GpuUnavailable
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: nvidia_smi_last_collect_success
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "NAS GPU is not responding to nvidia-smi"
          description: "gpu-exporter is up but nvidia-smi has been failing for 5+ minutes - driver hang or GPU off the bus. NVENC users (Stash, Tdarr, Jellyfin, backdrop-generate) will fail; check `dmesg | grep -i nvrm` on the NAS, a reboot is usually required."

      - uid: cert-expiring-soon
        title: CertExpiringSoon
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: (probe_ssl_earliest_cert_expiry{job=~".*tls-cert", instance!~".*step-ca:9000.*"} - time()) / 86400
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [7]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Cert for {{ $labels.instance }} expires in {{ $values.B.Value }} days"
          description: "TLS cert served by {{ $labels.instance }} has less than 7 days left - check the acme.sh renewal cron on the relevant host."

      - uid: router-packet-cost-high
        title: RouterPacketCostHigh
        condition: C
        for: 3h
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 21600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: 1e6 * sum(rate(node_cpu_seconds_total{job="openwrt", mode="softirq"}[6h])) / sum(rate(node_network_receive_packets_total{job="openwrt", device="eth0"}[6h]))
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                # VERIFY: ~3x the fresh-boot baseline (26-43 before flow offloading); retune once the post-offload baseline is known.
                - evaluator: {type: gt, params: [90]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Router packet cost {{ $values.B.Value }} µs/packet"
          description: "OpenWrt softirq cost per packet has been above 90 µs for 3h - throughput is degrading with uptime; a router reboot restores it (see docs/network.md)."
