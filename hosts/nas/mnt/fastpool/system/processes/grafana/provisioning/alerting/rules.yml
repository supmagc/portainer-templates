apiVersion: 1

groups:
  - orgId: 1
    name: home-alerts-default
    folder: Alerts
    interval: 1m
    rules:
      - uid: target-down
        title: TargetDown
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: up
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target down"
          description: "Scrape target {{ $labels.instance }} (job={{ $labels.job }}) has been down for 5+ minutes."

      - uid: container-crash-looping
        title: ContainerCrashLooping
        condition: C
        for: 0m
        noDataState: OK   # TargetDown already covers "the exporter is unreachable" - this just avoids duplicating that via the noisy synthetic DatasourceNoData alert
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: changes(container_start_time_seconds{name!=""}[15m])
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [2]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting repeatedly"
          description: "Container {{ $labels.name }} has restarted {{ $values.B.Value }} times in the last 15 minutes."

      - uid: disk-space-low
        title: DiskSpaceLow
        condition: C
        for: 10m
        noDataState: OK   # see ContainerCrashLooping above - TargetDown covers exporter-unreachable already
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              # fstype!="zfs": per-dataset % free is meaningless for ZFS - see PoolSpaceLow/
              # PoolSpaceCritical below for the real ZFS pool-capacity check. This rule now
              # only covers non-ZFS mounts (boot-pool overlay bits, USB, etc.).
              datasource: {type: prometheus, uid: prometheus}
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"}) * 100
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [15]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $values.B.Value }}% free space left."

      - uid: disk-space-critical
        title: DiskSpaceCritical
        condition: C
        for: 5m
        noDataState: OK   # see ContainerCrashLooping above
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              # see DiskSpaceLow above - ZFS mounts excluded, covered by PoolSpaceCritical instead
              datasource: {type: prometheus, uid: prometheus}
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"}) * 100
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [5]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $values.B.Value }}% free space left — act now."

      - uid: probe-failing
        title: ProbeFailing
        condition: C
        for: 3m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: probe_success
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} unreachable"
          description: "Blackbox probe against {{ $labels.instance }} (job={{ $labels.job }}) has been failing for 3+ minutes."

      # Real ZFS pool capacity, sourced from a node-exporter textfile-collector
      # metric (zpool_capacity_percent) - see hosts/nas/mnt/fastpool/system/scripts/
      # zpool-metrics.sh. node_filesystem_* can't be used for this: ZFS datasets
      # share the pool's free space, so a dataset with little of its own data
      # always reports near-100% free regardless of how full the pool actually is.
      - uid: pool-space-low
        title: PoolSpaceLow
        condition: C
        for: 10m
        noDataState: OK   # see ContainerCrashLooping above - zpool-metrics.sh cron missing a run just means the textfile is briefly stale, not worth its own no-data alert
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: zpool_capacity_percent
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [85]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Pool {{ $labels.pool }} is {{ $values.B.Value }}% full"
          description: "ZFS pool {{ $labels.pool }} has been above 85% capacity for 10+ minutes."

      - uid: pool-space-critical
        title: PoolSpaceCritical
        condition: C
        for: 5m
        noDataState: OK   # see PoolSpaceLow above
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: zpool_capacity_percent
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [95]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Pool {{ $labels.pool }} is {{ $values.B.Value }}% full — act now"
          description: "ZFS pool {{ $labels.pool }} has been above 95% capacity for 5+ minutes."

      # smartctl_device_smart_status is smartctl's own smart_status.passed field:
      # 1 = passed, 0 = failed (prometheus-community/smartctl_exporter source, mineSmartStatus()).
      - uid: disk-smart-failure
        title: DiskSmartFailure
        condition: C
        for: 0m
        noDataState: OK   # see ContainerCrashLooping above - TargetDown already watches the smartctl job itself
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: smartctl_device_smart_status
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "SMART failure on {{ $labels.device }}"
          description: "Disk {{ $labels.device }} on {{ $labels.instance }} is reporting a failed SMART overall-health status. Back it up / replace it."

      - uid: disk-temperature-high
        title: DiskTemperatureHigh
        condition: C
        for: 10m
        noDataState: OK   # see DiskSmartFailure above
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: smartctl_device_temperature{temperature_type="current"}
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [55]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} running hot ({{ $values.B.Value }}°C)"
          description: "Disk {{ $labels.device }} on {{ $labels.instance }} has been above 55°C for 10+ minutes. Check airflow/dust."

      - uid: pool-degraded
        title: PoolDegraded
        condition: C
        for: 0m
        noDataState: OK   # see PoolSpaceLow above
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: zpool_health
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Pool {{ $labels.pool }} is not ONLINE"
          description: "ZFS pool {{ $labels.pool }} is DEGRADED/FAULTED/OFFLINE/UNAVAIL/REMOVED - check `zpool status {{ $labels.pool }}` now."

      # cron_job_last_run_timestamp_seconds comes from cron-wrapper.sh (see
      # hosts/nas/mnt/fastpool/system/scripts/) - a job that stops running
      # entirely (cron disabled, script deleted, host down) wouldn't otherwise
      # be noticed, since there's no error to trigger on.
      #
      # NOTE: annotations below use $labels.exported_job, not $labels.job -
      # cron-wrapper.sh's own label is called "job", which collides with
      # Prometheus's scrape-config label of the same name (job="node" for
      # every textfile-collector metric); Prometheus's default collision
      # handling renames the metric's own label to "exported_job", which is
      # the real per-task identity.
      #
      # NOTE: 30m assumes every wrapped job runs at least every 5-10m (matches
      # zpool-metrics.sh today, the only job wrapped so far). If a job with a
      # longer schedule (e.g. daily) gets wrapped later, split it into its own
      # rule with a threshold matching its own schedule instead of raising
      # this one - a single global threshold stops making sense once jobs
      # have different cadences.
      - uid: cron-job-stale
        title: CronJobStale
        condition: C
        for: 5m
        noDataState: OK   # see PoolSpaceLow above - TargetDown already watches node-exporter itself
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: time() - cron_job_last_run_timestamp_seconds
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [1800]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Cron job {{ $labels.exported_job }} hasn't run in 30+ minutes"
          description: "cron-wrapper.sh last recorded a run of {{ $labels.exported_job }} {{ $values.B.Value }}s ago - check the TrueNAS Cron Jobs task and that it's still enabled."

      - uid: cron-job-failed
        title: CronJobFailed
        condition: C
        for: 0m
        noDataState: OK   # see CronJobStale above
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: cron_job_last_exit_code
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Cron job {{ $labels.exported_job }} failed"
          description: "cron-wrapper.sh recorded exit code {{ $values.B.Value }} for {{ $labels.exported_job }}'s last run."

      # snapshot_task_last_success/enabled come from snapshot-tasks-metrics.sh
      # (see hosts/nas/mnt/fastpool/system/scripts/) - the `and` join on the
      # shared `dataset` label means this query returns ONLY tasks that are
      # both enabled and not currently in a FINISHED state, so a disabled task
      # (last_success also reads 0, since it never runs) never shows up here.
      - uid: snapshot-task-failed
        title: SnapshotTaskFailed
        condition: C
        for: 0m
        noDataState: OK   # no rows = nothing enabled is currently failing
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: snapshot_task_last_success == 0 and snapshot_task_enabled == 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Snapshot task for {{ $labels.dataset }} isn't finishing"
          description: "Periodic Snapshot Task for {{ $labels.dataset }} is enabled but its last run didn't reach FINISHED - check snapshot_task_state_info{{ '{' }}dataset=\"{{ $labels.dataset }}\"{{ '}' }} for the actual state, and `zpool status`/TrueNAS's Data Protection page."

      # probe_ssl_earliest_cert_expiry comes for free from any https:// blackbox
      # probe. Currently only meaningful for blackbox-openhabian-proxy's three
      # targets - their cert is renewed nightly by acme.sh against step-ca on a
      # documented fragile path (acme.sh must successfully stop Caddy to bind
      # :80 for the HTTP-01 challenge; see docs/CONTEXT.md) with nothing else
      # watching for a silent renewal failure.
      - uid: cert-expiring-soon
        title: CertExpiringSoon
        condition: C
        for: 0m
        noDataState: OK   # see ContainerCrashLooping above - ProbeFailing already watches these targets being reachable at all
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: (probe_ssl_earliest_cert_expiry - time()) / 86400
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [7]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Cert for {{ $labels.instance }} expires in {{ $values.B.Value }} days"
          description: "TLS cert served by {{ $labels.instance }} has less than 7 days left - check the acme.sh renewal cron on the relevant host."

      - uid: cloudsync-task-failed
        title: CloudSyncTaskFailed
        condition: C
        for: 0m
        noDataState: OK   # see SnapshotTaskFailed above
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: cloudsync_task_last_success == 0 and cloudsync_task_enabled == 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Cloud sync task {{ $labels.task }} isn't succeeding"
          description: "Cloud Sync Task \"{{ $labels.task }}\" is enabled but its last run didn't report SUCCESS - check cloudsync_task_state_info{{ '{' }}task=\"{{ $labels.task }}\"{{ '}' }} for the actual state, and its job log on TrueNAS's Data Protection page."
