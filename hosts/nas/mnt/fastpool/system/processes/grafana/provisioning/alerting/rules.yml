apiVersion: 1

groups:
  - orgId: 1
    name: home-alerts-default
    folder: Alerts
    interval: 1m
    rules:
      - uid: target-down
        title: TargetDown
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: up
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target down"
          description: "Scrape target {{ $labels.instance }} (job={{ $labels.job }}) has been down for 5+ minutes."

      - uid: container-crash-looping
        title: ContainerCrashLooping
        condition: C
        for: 0m
        noDataState: OK   # TargetDown already covers "the exporter is unreachable" - this just avoids duplicating that via the noisy synthetic DatasourceNoData alert
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: changes(container_start_time_seconds{name!=""}[15m])
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [2]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting repeatedly"
          description: "Container {{ $labels.name }} has restarted {{ $values.B.Value }} times in the last 15 minutes."

      # ContainerCrashLooping (above) only catches containers that are *restarting*.
      # A container whose Docker healthcheck is failing but whose process stays up
      # never restarts on its own (restart: unless-stopped reacts to the process
      # exiting, not to health) - so it sits there unhealthy and nothing notices.
      # This rule closes that gap.
      #
      # container_health_state is a cAdvisor metric (Docker-only). Values seen on
      # this box: -1 = no HEALTHCHECK defined, 0 = unhealthy OR still "starting",
      # 1 = healthy. Query is `>= 0` (not `== 0`) so every health-checked container
      # yields an alert instance - Normal at 1, Alerting at 0 - the same all-series
      # pattern as ProbeFailing; the -1 (no-healthcheck) containers drop out since
      # there's nothing to alert on. Threshold fires at `< 1`, i.e. exactly 0. The
      # 10m `for:` separates a genuinely stuck container from one legitimately
      # still in its start_period (nothing here takes >10m to go healthy).
      #
      # NOTE: this metric is NOT in any stock cAdvisor release (checked master +
      # v0.49-v0.53) - the running cadvisor image is a patched/forked build even
      # though docker-compose-monitoring.yml pins gcr.io/cadvisor/cadvisor:latest.
      # A plain image repull would silently drop the metric; noDataState: NoData
      # (below) surfaces that instead of hiding it. See docs/monitoring.md.
      - uid: container-unhealthy
        title: ContainerUnhealthy
        condition: C
        for: 10m
        noDataState: NoData   # metric is present for every healthchecked container normally - no data means cadvisor is down (TargetDown covers that) or the forked image lost the metric (want to know)
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: container_health_state{name!=""} >= 0
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is unhealthy"
          description: "Container {{ $labels.name }} (image {{ $labels.image }}) has had a failing Docker healthcheck for 10+ minutes — cAdvisor reports container_health_state=0 (unhealthy, or stuck in 'starting'). It won't necessarily restart on its own, so ContainerCrashLooping won't catch it — check the container's healthcheck and logs."

      - uid: disk-space-low
        title: DiskSpaceLow
        condition: C
        for: 10m
        noDataState: OK   # see ContainerCrashLooping above - TargetDown covers exporter-unreachable already
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              # fstype!="zfs": per-dataset % free is meaningless for ZFS - see PoolSpaceLow/
              # PoolSpaceCritical below for the real ZFS pool-capacity check. This rule now
              # only covers non-ZFS mounts (boot-pool overlay bits, USB, etc.).
              datasource: {type: prometheus, uid: prometheus}
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"}) * 100
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [15]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $values.B.Value }}% free space left."

      - uid: disk-space-critical
        title: DiskSpaceCritical
        condition: C
        for: 5m
        noDataState: OK   # see ContainerCrashLooping above
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              # see DiskSpaceLow above - ZFS mounts excluded, covered by PoolSpaceCritical instead
              datasource: {type: prometheus, uid: prometheus}
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|zfs"}) * 100
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [5]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $values.B.Value }}% free space left — act now."

      - uid: probe-failing
        title: ProbeFailing
        condition: C
        for: 3m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: probe_success
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} unreachable"
          description: "Blackbox probe against {{ $labels.instance }} (job={{ $labels.job }}) has been failing for 3+ minutes."

      # Real ZFS pool capacity, sourced from a node-exporter textfile-collector
      # metric (zpool_capacity_percent) - see hosts/nas/mnt/fastpool/system/scripts/
      # zpool-metrics.sh. node_filesystem_* can't be used for this: ZFS datasets
      # share the pool's free space, so a dataset with little of its own data
      # always reports near-100% free regardless of how full the pool actually is.
      - uid: pool-space-low
        title: PoolSpaceLow
        condition: C
        for: 10m
        noDataState: OK   # see ContainerCrashLooping above - zpool-metrics.sh cron missing a run just means the textfile is briefly stale, not worth its own no-data alert
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: zpool_capacity_percent
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [85]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Pool {{ $labels.pool }} is {{ $values.B.Value }}% full"
          description: "ZFS pool {{ $labels.pool }} has been above 85% capacity for 10+ minutes."

      - uid: pool-space-critical
        title: PoolSpaceCritical
        condition: C
        for: 5m
        noDataState: OK   # see PoolSpaceLow above
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: zpool_capacity_percent
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [95]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Pool {{ $labels.pool }} is {{ $values.B.Value }}% full — act now"
          description: "ZFS pool {{ $labels.pool }} has been above 95% capacity for 5+ minutes."

      # smartctl_device_smart_status is smartctl's own smart_status.passed field:
      # 1 = passed, 0 = failed (prometheus-community/smartctl_exporter source, mineSmartStatus()).
      - uid: disk-smart-failure
        title: DiskSmartFailure
        condition: C
        for: 0m
        noDataState: OK   # see ContainerCrashLooping above - TargetDown already watches the smartctl job itself
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: smartctl_device_smart_status
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "SMART failure on {{ $labels.device }}"
          description: "Disk {{ $labels.device }} on {{ $labels.instance }} is reporting a failed SMART overall-health status. Back it up / replace it."

      - uid: disk-temperature-high
        title: DiskTemperatureHigh
        condition: C
        for: 10m
        noDataState: OK   # see DiskSmartFailure above
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: smartctl_device_temperature{temperature_type="current"}
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [55]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} running hot ({{ $values.B.Value }}°C)"
          description: "Disk {{ $labels.device }} on {{ $labels.instance }} has been above 55°C for 10+ minutes. Check airflow/dust."

      - uid: pool-degraded
        title: PoolDegraded
        condition: C
        for: 0m
        noDataState: OK   # see PoolSpaceLow above
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: zpool_health
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: critical
        annotations:
          summary: "Pool {{ $labels.pool }} is not ONLINE"
          description: "ZFS pool {{ $labels.pool }} is DEGRADED/FAULTED/OFFLINE/UNAVAIL/REMOVED - check `zpool status {{ $labels.pool }}` now."

      # scheduled_job_* is the shared metric family every scheduled-job
      # source in this repo writes into - see docs/monitoring.md "Scheduled
      # jobs (unified)": cron-wrapper.sh (NAS cron jobs, source="nas-cron"),
      # snapshot-tasks-metrics.sh (source="nas-snapshot"),
      # cloudsync-tasks-metrics.sh (source="nas-cloudsync"), and
      # systemd-tasks-metrics.sh on openHABian (source="openhabian-timer" for
      # all 5 of its systemd-timer-driven jobs - amdump-openhab-dir,
      # amandaBackupDB, acme-renew, sdrawcopy, sdrsync). One textfile-collector
      # idiom for every source means adding a new one is always just "write
      # the scheduled_job_* family", no rule changes here.
      #
      # Labels are deliberately just {source, name} - no label here is named
      # "job", which would collide with Prometheus's own scrape-config label
      # of that name and get silently renamed to "exported_job" (the trap the
      # old cron_job_* metrics fell into).
      - uid: scheduled-job-stale
        title: ScheduledJobStale
        condition: C
        for: 5m
        noDataState: OK   # TargetDown already watches every node-exporter instance itself
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: (time() - scheduled_job_last_run_timestamp_seconds) - scheduled_job_expected_interval_seconds and scheduled_job_enabled == 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job {{ $labels.source }}/{{ $labels.name }} hasn't run on time"
          description: "{{ $labels.source }}/{{ $labels.name }} is {{ $values.B.Value }}s overdue against its expected interval - check the underlying scheduler (TrueNAS Cron Jobs / Data Protection task / systemd timer, depending on {{ $labels.source }})."

      - uid: scheduled-job-failed
        title: ScheduledJobFailed
        condition: C
        for: 0m
        noDataState: OK   # see ScheduledJobStale above
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: scheduled_job_last_exit_code and scheduled_job_enabled == 1
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job {{ $labels.source }}/{{ $labels.name }} failed"
          description: "{{ $labels.source }}/{{ $labels.name }}'s last run did not succeed - check its row on the NAS Overview \"Scheduled Jobs\" table (nas-* sources) or `systemctl status {{ $labels.name }}` on the Pi (openhabian-* sources)."

      # probe_ssl_earliest_cert_expiry comes from any TLS blackbox probe -
      # dedicated coverage is blackbox-tls-cert (tls_connect module, checks
      # reachability + expiry only), plus it comes for free from every
      # blackbox-https target since those are also https://. No job
      # filter here so both count - but step-ca:9000 is excluded (regex, since
      # blackbox-tls-cert labels it `step-ca:9000` while blackbox-https labels
      # the same listener `https://step-ca:9000/health`): the cert step-ca
      # serves on its own API listener is self-issued with the default 24h
      # lifetime and auto-renewed at ~16h, so it's permanently under the 7d
      # threshold. A real failure of that self-renewal takes the CA down and
      # trips ProbeFailing on both step-ca probes instead.
      # Most load-bearing for openhabian's three
      # subdomains - their shared cert is renewed nightly by acme.sh against
      # step-ca on a documented fragile path (acme.sh must successfully stop
      # Caddy to bind :80 for the HTTP-01 challenge; see docs/network.md) with
      # nothing else watching for a silent renewal failure.
      - uid: cert-expiring-soon
        title: CertExpiringSoon
        condition: C
        for: 0m
        noDataState: OK   # see ContainerCrashLooping above - ProbeFailing already watches these targets being reachable at all
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              expr: (probe_ssl_earliest_cert_expiry{instance!~".*step-ca:9000.*"} - time()) / 86400
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "__expr__"
            model:
              datasource: {type: "__expr__", uid: "__expr__"}
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: {type: lt, params: [7]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
        labels:
          severity: warning
        annotations:
          summary: "Cert for {{ $labels.instance }} expires in {{ $values.B.Value }} days"
          description: "TLS cert served by {{ $labels.instance }} has less than 7 days left - check the acme.sh renewal cron on the relevant host."
