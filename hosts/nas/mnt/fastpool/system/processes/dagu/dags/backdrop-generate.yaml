secrets:
  - name: RADARR_API_KEY
    ref: backdrop-generate/radarr-api-key
  - name: SONARR_API_KEY
    ref: backdrop-generate/sonarr-api-key
  - name: MEDIASERVER_API_KEY
    ref: backdrop-generate/mediaserver-api-key

params:
  - name: DRY_RUN
    default: "false"
  # override with MAX_ITEMS_PER_RUN=0 for a one-off manual catch-up run
  - name: MAX_ITEMS_PER_RUN
    default: "20"
  - name: PROCESS_UID  # nas_processes
    default: 920
  - name: PROCESS_GID
    default: 920
  - name: MEDIA_UID  # nas_multimedia
    default: 910
  - name: MEDIA_GID
    default: 910
  - name: N_SAMPLES
    default: "10"
  - name: SAMPLE_DURATION
    default: "3"
  - name: SERIES_EPISODES
    default: "3"

# deliberately after themerr-fetch (03:30) - see docs/monitoring.md for why
schedule: "0 5 * * *"
max_active_runs: 1

# See docs/monitoring.md's backdrop-generate section for the clip-selection design.
steps:
  - id: generate
    action: docker.run
    with:
      image: jrottenberg/ffmpeg:8.0-nvidia
      pull: missing
      auto_remove: true
      network:
        EndpointsConfig:
          multimedia_default: {}
      host:
        Runtime: nvidia
      volumes:
        - /mnt/fastpool/system/processes/dagu/scripts/backdrop_generate.py:/app/backdrop_generate.py:ro
        - /mnt/fastpool/system/processes/dagu/job-data/backdrop-generate:/data
        - /mnt/rightpool/multimedia/movies:/media/movies
        - /mnt/rightpool/multimedia/series:/media/tv
      container:
        entrypoint: []  # image's own ENTRYPOINT is ["ffmpeg"] - must clear it to run our command
        env:
          - NVIDIA_VISIBLE_DEVICES=all
          - NVIDIA_DRIVER_CAPABILITIES=all
          - RADARR_URL=http://radarr:7878
          - RADARR_API_KEY=${env.RADARR_API_KEY}
          - SONARR_URL=http://sonarr:8989
          - SONARR_API_KEY=${env.SONARR_API_KEY}
          - PATH_MAP=/movies=/media/movies;/tv=/media/tv
          - MEDIASERVER_TYPE=emby
          - MEDIASERVER_URL=http://emby:8096
          - MEDIASERVER_API_KEY=${env.MEDIASERVER_API_KEY}
          - DATA_DIR=/data
          - N_SAMPLES=${params.N_SAMPLES}
          - SAMPLE_DURATION=${params.SAMPLE_DURATION}
          - SERIES_EPISODES=${params.SERIES_EPISODES}
          - MAX_ITEMS_PER_RUN=${params.MAX_ITEMS_PER_RUN}
          - PROCESS_UID=${params.PROCESS_UID}
          - PROCESS_GID=${params.PROCESS_GID}
          - MEDIA_UID=${params.MEDIA_UID}
          - MEDIA_GID=${params.MEDIA_GID}
          - DRY_RUN=${params.DRY_RUN}
          - DEBIAN_FRONTEND=noninteractive
      command: >-
        sh -c 'set -e;
        apt-get update -qq;
        apt-get install -y -qq --no-install-recommends python3 >/dev/null;
        python3 /app/backdrop_generate.py'
    output: BACKDROP_RESULT
    retry_policy:
      limit: 2
      interval_sec: 600
