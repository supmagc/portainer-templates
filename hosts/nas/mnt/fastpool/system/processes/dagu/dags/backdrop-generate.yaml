secrets:
  - name: RADARR_API_KEY
    ref: backdrop-generate/radarr-api-key
  - name: SONARR_API_KEY
    ref: backdrop-generate/sonarr-api-key
  - name: MEDIASERVER_API_KEY
    ref: backdrop-generate/mediaserver-api-key

params:
  - name: DRY_RUN
    default: "false"
  # override with MAX_ITEMS_PER_RUN=0 for a one-off manual catch-up run
  - name: MAX_ITEMS_PER_RUN
    default: "20"
  # override with MAX_DOWNLOADS=0 for a one-off manual catch-up run
  - name: MAX_DOWNLOADS
    default: "50"
  # false = local montages only, no ThemerrDB videos
  - name: THEMERR_VIDEOS
    default: "true"
  - name: PROCESS_UID  # nas_processes
    default: 920
  - name: PROCESS_GID
    default: 920
  - name: MEDIA_UID  # nas_multimedia
    default: 910
  - name: MEDIA_GID
    default: 910
  - name: N_SAMPLES
    default: "10"
  - name: SAMPLE_DURATION
    default: "3"
  - name: SERIES_EPISODES
    default: "3"

# deliberately after themerr-fetch (03:30) - see docs/monitoring.md for why
schedule: "0 5 * * *"
max_active_runs: 1

# See docs/monitoring.md's backdrop-generate section for the design.
steps:
  - id: vendor
    action: docker.run
    with:
      image: docker:cli
      pull: missing
      auto_remove: true
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /mnt/fastpool/system/processes/dagu/job-data/backdrop-generate:/out
      command: >-
        sh -c 'set -e;
        docker pull -q denoland/deno:bin;
        id=$(docker create denoland/deno:bin noop);
        docker cp "$id":/deno /out/deno;
        docker rm "$id" >/dev/null;
        chmod +x /out/deno'

  - id: generate
    depends: vendor
    timeout_sec: 7200
    action: docker.run
    with:
      image: jrottenberg/ffmpeg:8.0-nvidia
      pull: missing
      auto_remove: true
      network:
        EndpointsConfig:
          multimedia_default: {}
      host:
        Runtime: nvidia
      volumes:
        - /mnt/fastpool/system/processes/dagu/scripts/backdrop-generate.py:/app/backdrop-generate.py:ro
        - /mnt/fastpool/system/processes/dagu/job-data/backdrop-generate:/data
        - /mnt/rightpool/multimedia/movies:/media/movies
        - /mnt/rightpool/multimedia/series:/media/tv
      container:
        entrypoint: []  # image's own ENTRYPOINT is ["ffmpeg"] - must clear it to run our command
        env:
          - NVIDIA_VISIBLE_DEVICES=all
          - NVIDIA_DRIVER_CAPABILITIES=all
          - RADARR_URL=http://radarr:7878
          - RADARR_API_KEY=${env.RADARR_API_KEY}
          - SONARR_URL=http://sonarr:8989
          - SONARR_API_KEY=${env.SONARR_API_KEY}
          - PATH_MAP=/movies=/media/movies;/tv=/media/tv
          - MEDIASERVER_TYPE=jellyfin
          - MEDIASERVER_URL=http://jellyfin:8196
          - MEDIASERVER_API_KEY=${env.MEDIASERVER_API_KEY}
          - DATA_DIR=/data
          - N_SAMPLES=${params.N_SAMPLES}
          - SAMPLE_DURATION=${params.SAMPLE_DURATION}
          - SERIES_EPISODES=${params.SERIES_EPISODES}
          - MAX_ITEMS_PER_RUN=${params.MAX_ITEMS_PER_RUN}
          - MAX_DOWNLOADS=${params.MAX_DOWNLOADS}
          - THEMERR_VIDEOS=${params.THEMERR_VIDEOS}
          - DOWNLOAD_DELAY=5
          - PROCESS_UID=${params.PROCESS_UID}
          - PROCESS_GID=${params.PROCESS_GID}
          - MEDIA_UID=${params.MEDIA_UID}
          - MEDIA_GID=${params.MEDIA_GID}
          - DRY_RUN=${params.DRY_RUN}
          - DEBIAN_FRONTEND=noninteractive
      command: >-
        sh -c 'set -e;
        apt-get update -qq;
        apt-get install -y -qq --no-install-recommends python3 ca-certificates >/dev/null;
        python3 /app/backdrop-generate.py'
    output: BACKDROP_RESULT
    retry_policy:
      limit: 2
      interval_sec: 600
