secrets:
  - name: RADARR_API_KEY
    ref: trailer-fetch/radarr-api-key
  - name: SONARR_API_KEY
    ref: trailer-fetch/sonarr-api-key
  - name: TMDB_API_KEY
    ref: trailer-fetch/tmdb-api-key
  - name: MEDIASERVER_API_KEY
    ref: trailer-fetch/mediaserver-api-key

params:
  - name: DRY_RUN
    default: "false"
  # override with MAX_DOWNLOADS=0 for a one-off manual catch-up run
  - name: MAX_DOWNLOADS
    default: "50"
  # original-language trailers kept per item, 0 = unlimited
  - name: MAX_TRAILERS
    default: "5"
  - name: ORIGINAL_LANGUAGE_ONLY
    default: "true"
  - name: PROCESS_UID  # nas_processes
    default: 920
  - name: PROCESS_GID
    default: 920
  - name: MEDIA_UID  # nas_multimedia
    default: 910
  - name: MEDIA_GID
    default: 910

schedule: "0 2 * * *"
max_active_runs: 1

# See docs/monitoring.md's trailer-fetch section for the design.
steps:
  - id: vendor
    action: docker.run
    with:
      image: docker:cli
      pull: missing
      auto_remove: true
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /mnt/fastpool/system/processes/dagu/job-data/trailer-fetch:/out
      command: >-
        sh -c 'set -e;
        docker pull -q denoland/deno:bin;
        id=$(docker create denoland/deno:bin noop);
        docker cp "$id":/deno /out/deno;
        docker rm "$id" >/dev/null;
        chmod +x /out/deno'

  - id: fetch
    depends: vendor
    action: docker.run
    with:
      image: jrottenberg/ffmpeg:8.0-nvidia
      pull: missing
      auto_remove: true
      network:
        EndpointsConfig:
          multimedia_default: {}
      host:
        Runtime: nvidia
      volumes:
        - /mnt/fastpool/system/processes/dagu/scripts/trailer-fetch.py:/app/trailer-fetch.py:ro
        - /mnt/fastpool/system/processes/dagu/job-data/trailer-fetch:/data
        # same container paths as Emby/Jellyfin, so media-server notifications need no mapping
        - /mnt/rightpool/multimedia/movies:/mnt/movies
        - /mnt/rightpool/multimedia/series:/mnt/series
      container:
        entrypoint: []  # image's own ENTRYPOINT is ["ffmpeg"] - must clear it to run our command
        env:
          - NVIDIA_VISIBLE_DEVICES=all
          - NVIDIA_DRIVER_CAPABILITIES=all
          - RADARR_URL=http://radarr:7878
          - RADARR_API_KEY=${env.RADARR_API_KEY}
          - SONARR_URL=http://sonarr:8989
          - SONARR_API_KEY=${env.SONARR_API_KEY}
          - TMDB_API_KEY=${env.TMDB_API_KEY}
          - PATH_MAP=/movies=/mnt/movies;/tv=/mnt/series
          - MEDIASERVER_TYPE=jellyfin
          - MEDIASERVER_URL=http://jellyfin:8196
          - MEDIASERVER_API_KEY=${env.MEDIASERVER_API_KEY}
          - DATA_DIR=/data
          - DOWNLOAD_DELAY=5
          - MAX_DOWNLOADS=${params.MAX_DOWNLOADS}
          - MAX_TRAILERS=${params.MAX_TRAILERS}
          - ORIGINAL_LANGUAGE_ONLY=${params.ORIGINAL_LANGUAGE_ONLY}
          - PROCESS_UID=${params.PROCESS_UID}
          - PROCESS_GID=${params.PROCESS_GID}
          - MEDIA_UID=${params.MEDIA_UID}
          - MEDIA_GID=${params.MEDIA_GID}
          - DRY_RUN=${params.DRY_RUN}
          - DEBIAN_FRONTEND=noninteractive
      command: >-
        sh -c 'set -e;
        apt-get update -qq;
        apt-get install -y -qq --no-install-recommends python3 ca-certificates >/dev/null;
        python3 /app/trailer-fetch.py'
    output: TRAILER_RESULT
    retry_policy:
      limit: 2
      interval_sec: 600
