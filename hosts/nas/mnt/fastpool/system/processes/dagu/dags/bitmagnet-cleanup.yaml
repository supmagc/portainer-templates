secrets:
  - name: PGPASSWORD
    ref: bitmagnet-cleanup/db-password

schedule: "0 3 * * *"
steps:
  - id: prune
    action: postgres.query
    retry_policy:
      limit: 5
      interval_sec: 30
    with:
      dsn: "postgres://bitmagnet_cleanup:${env.PGPASSWORD}@postgres:5432/bitmagnet"
      timeout: 600
      # Body is single-quoted, not $$-quoted, so Dagu's $-variable expansion can't touch it.
      query: |
        do '
        declare
          candidates bytea[];
          batch_deleted int;
          total_deleted int := 0;
          deadlocks int := 0;
        begin
          select coalesce(array_agg(info_hash), array[]::bytea[]) into candidates from (
            with latest_source as (
              select distinct on (info_hash)
                info_hash, updated_at as last_seen, seeders
              from torrents_torrent_sources
              order by info_hash, updated_at desc
            ),
            classified as (
              select distinct info_hash from torrent_contents
            )
            select ls.info_hash
            from latest_source ls
            left join classified c on c.info_hash = ls.info_hash
            where
              (c.info_hash is null
                 and (ls.last_seen < now() - make_interval(days => 30)
                      or coalesce(ls.seeders, 0) = 0))
              or (c.info_hash is not null
                 and ls.last_seen < now() - make_interval(months => 9)
                 and coalesce(ls.seeders, 0) = 0)
            limit 2000
          ) s;
          commit;

          loop
            begin
              delete from torrents t
              where t.info_hash in (
                select tt.info_hash from torrents tt
                where tt.info_hash = any(candidates)
                order by tt.info_hash
                limit 200
                for update skip locked
              );
              get diagnostics batch_deleted = row_count;
            exception when deadlock_detected then
              deadlocks := deadlocks + 1;
              batch_deleted := -1;
            end;
            exit when batch_deleted = 0 or deadlocks >= 10;
            total_deleted := total_deleted + greatest(batch_deleted, 0);
            commit;
          end loop;

          raise notice ''bitmagnet-cleanup: deleted % of % candidates, % deadlocked batches'',
            total_deleted, cardinality(candidates), deadlocks;
          if deadlocks >= 10 then
            raise exception ''bitmagnet-cleanup: gave up after % deadlocks (% deleted)'', deadlocks, total_deleted;
          end if;
        end
        ';
