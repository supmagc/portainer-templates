secrets:
  - name: PGPASSWORD
    ref: bitmagnet-cleanup/db-password

schedule: "0 3 * * *"
steps:
  - id: prune
    action: postgres.query
    retry_policy:
      limit: 5
      interval_sec: 30
    with:
      dsn: "postgres://bitmagnet_cleanup:${env.PGPASSWORD}@postgres:5432/bitmagnet"
      # Must exceed the 40-minute delete budget inside the DO block plus ~1 min candidate scan.
      timeout: 3000
      # No SQL comments or $$-quoting below: Dagu's splitter misreads comments and expands $-variables.
      query: |
        set work_mem = '256MB';
        do '
        declare
          v_started timestamptz := clock_timestamp();
          v_deadline timestamptz := clock_timestamp() + make_interval(mins => 40);
          v_candidates bigint;
          v_max_id bigint;
          v_lo bigint := 0;
          v_batch int;
          v_deleted bigint := 0;
          v_deadlocks int := 0;
        begin
          insert into maintenance.bitmagnet_cleanup_runs (started_at) values (v_started);
          commit;

          drop table if exists pg_temp.cleanup_candidates;
          create temp table cleanup_candidates (
            id bigint generated always as identity primary key,
            info_hash bytea not null
          );
          insert into cleanup_candidates (info_hash)
          select s.info_hash
          from torrents_torrent_sources s
          join torrent_contents tc on tc.info_hash = s.info_hash
          group by s.info_hash
          having (not bool_or(tc.content_type is not null)
                  and (max(s.updated_at) < now() - make_interval(days => 30)
                       or coalesce(max(s.seeders), 0) = 0))
              or (bool_or(tc.content_type is not null)
                  and max(s.updated_at) < now() - make_interval(months => 9)
                  and coalesce(max(s.seeders), 0) = 0)
          order by s.info_hash;
          get diagnostics v_candidates = row_count;
          select coalesce(max(id), 0) into v_max_id from cleanup_candidates;
          update maintenance.bitmagnet_cleanup_runs set candidates = v_candidates where started_at = v_started;
          commit;

          while v_lo < v_max_id and clock_timestamp() < v_deadline and v_deadlocks < 10 loop
            begin
              delete from torrents t
              where t.info_hash in (
                select tt.info_hash from torrents tt
                join cleanup_candidates c on c.info_hash = tt.info_hash
                where c.id > v_lo and c.id <= v_lo + 1000
                for update of tt skip locked
              );
              get diagnostics v_batch = row_count;
              v_deleted := v_deleted + v_batch;
              v_lo := v_lo + 1000;
            exception when deadlock_detected then
              v_deadlocks := v_deadlocks + 1;
            end;
            update maintenance.bitmagnet_cleanup_runs
              set deleted = v_deleted, deadlocks = v_deadlocks
              where started_at = v_started;
            commit;
          end loop;

          update maintenance.bitmagnet_cleanup_runs
            set finished_at = clock_timestamp(), deleted = v_deleted, deadlocks = v_deadlocks,
                completed = (v_lo >= v_max_id)
            where started_at = v_started;
          commit;

          if v_deadlocks >= 10 then
            raise exception ''bitmagnet-cleanup: gave up after % deadlocks (% deleted)'', v_deadlocks, v_deleted;
          end if;
        end
        ';
        select started_at, finished_at, candidates, deleted, deadlocks, completed
        from maintenance.bitmagnet_cleanup_runs order by started_at desc limit 1;
