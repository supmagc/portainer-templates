secrets:
  - name: RADARR_API_KEY
    ref: themerr-fetch/radarr-api-key
  - name: SONARR_API_KEY
    ref: themerr-fetch/sonarr-api-key
  - name: EMBY_API_KEY
    ref: themerr-fetch/emby-api-key

params:
  - name: DRY_RUN
    default: "false"
  # override with MAX_DOWNLOADS=0 for a one-off manual catch-up run
  - name: MAX_DOWNLOADS
    default: "100"

schedule: "30 3 * * *"
max_active_runs: 1

# See docs/monitoring.md's themerr-fetch section for the vendor/fetch step design.
steps:
  - id: vendor
    action: docker.run
    with:
      image: docker:cli
      pull: missing
      auto_remove: true
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /mnt/fastpool/system/processes/themerr-fetch:/out
    command: >-
      sh -c 'set -e;
      docker pull -q mwader/static-ffmpeg:latest;
      id=$(docker create mwader/static-ffmpeg:latest);
      docker cp "$id":/ffmpeg /out/ffmpeg;
      docker cp "$id":/ffprobe /out/ffprobe;
      docker rm "$id" >/dev/null;
      docker pull -q denoland/deno:bin;
      id=$(docker create denoland/deno:bin);
      docker cp "$id":/deno /out/deno;
      docker rm "$id" >/dev/null;
      chmod +x /out/ffmpeg /out/ffprobe /out/deno'

  - id: fetch
    depends: vendor
    action: docker.run
    with:
      image: python:3.12-slim
      pull: missing
      auto_remove: true
      network:
        EndpointsConfig:
          multimedia_default: {}
      volumes:
        - /mnt/fastpool/system/processes/dagu/scripts/themerr_fetch.py:/app/themerr_fetch.py:ro
        - /mnt/fastpool/system/processes/themerr-fetch:/data
        - /mnt/rightpool/multimedia/movies:/media/movies
        - /mnt/rightpool/multimedia/series:/media/tv
      container:
        env:
          - RADARR_URL=http://radarr:7878
          - RADARR_API_KEY=${env.RADARR_API_KEY}
          - SONARR_URL=http://sonarr:8989
          - SONARR_API_KEY=${env.SONARR_API_KEY}
          - PATH_MAP=/movies=/media/movies;/tv=/media/tv
          - MEDIASERVER_TYPE=emby
          - MEDIASERVER_URL=http://emby:8096
          - MEDIASERVER_API_KEY=${env.EMBY_API_KEY}
          - LOUDNESS_LUFS=-16
          - DOWNLOAD_DELAY=5
          - DRY_RUN=${params.DRY_RUN}
          - MAX_DOWNLOADS=${params.MAX_DOWNLOADS}
    command: python3 /app/themerr_fetch.py
    output: THEMERR_RESULT
    retry_policy:
      limit: 2
      interval_sec: 600
