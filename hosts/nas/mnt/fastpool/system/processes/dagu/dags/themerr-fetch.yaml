secrets:
  - name: RADARR_API_KEY
    ref: themerr-fetch/radarr-api-key
  - name: SONARR_API_KEY
    ref: themerr-fetch/sonarr-api-key
  - name: MEDIASERVER_API_KEY
    ref: themerr-fetch/mediaserver-api-key

params:
  - name: DRY_RUN
    default: "false"
  # override with MAX_DOWNLOADS=0 for a one-off manual catch-up run
  - name: MAX_DOWNLOADS
    default: "100"
  - name: PROCESS_UID  # nas_processes
    default: 920
  - name: PROCESS_GID
    default: 920
  - name: MEDIA_UID  # nas_multimedia
    default: 910
  - name: MEDIA_GID
    default: 910

schedule: "30 3 * * *"
max_active_runs: 1

# See docs/monitoring.md's themerr-fetch section for the vendor/fetch step design.
steps:
  - id: vendor
    action: docker.run
    with:
      image: docker:cli
      pull: missing
      auto_remove: true
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /mnt/fastpool/system/processes/dagu/job-data/themerr-fetch:/out
      command: >-
        sh -c 'set -e;
        docker pull -q mwader/static-ffmpeg:latest;
        id=$(docker create mwader/static-ffmpeg:latest noop);
        docker cp "$id":/ffmpeg /out/ffmpeg;
        docker rm "$id" >/dev/null;
        docker pull -q denoland/deno:bin;
        id=$(docker create denoland/deno:bin noop);
        docker cp "$id":/deno /out/deno;
        docker rm "$id" >/dev/null;
        chmod +x /out/ffmpeg /out/deno'

  - id: fetch
    depends: vendor
    action: docker.run
    with:
      image: python:3.12-slim
      pull: missing
      auto_remove: true
      network:
        EndpointsConfig:
          multimedia_default: {}
      volumes:
        - /mnt/fastpool/system/processes/dagu/scripts/themerr-fetch.py:/app/themerr-fetch.py:ro
        - /mnt/fastpool/system/processes/dagu/job-data/themerr-fetch:/data
        - /mnt/rightpool/multimedia/movies:/media/movies
        - /mnt/rightpool/multimedia/series:/media/tv
      container:
        env:
          - RADARR_URL=http://radarr:7878
          - RADARR_API_KEY=${env.RADARR_API_KEY}
          - SONARR_URL=http://sonarr:8989
          - SONARR_API_KEY=${env.SONARR_API_KEY}
          - PATH_MAP=/movies=/media/movies;/tv=/media/tv
          - MEDIASERVER_TYPE=emby
          - MEDIASERVER_URL=http://emby:8096
          - MEDIASERVER_API_KEY=${env.MEDIASERVER_API_KEY}
          - LOUDNESS_LUFS=-16
          - DOWNLOAD_DELAY=5
          - DRY_RUN=${params.DRY_RUN}
          - MAX_DOWNLOADS=${params.MAX_DOWNLOADS}
          - PROCESS_UID=${params.PROCESS_UID}
          - PROCESS_GID=${params.PROCESS_GID}
          - MEDIA_UID=${params.MEDIA_UID}
          - MEDIA_GID=${params.MEDIA_GID}
      command: python3 /app/themerr-fetch.py
    output: THEMERR_RESULT
    retry_policy:
      limit: 2
      interval_sec: 600
