use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  enable_metrics: false
  contact_url: "{{SEARXNG_CONTACT_URL}}"

server:
  secret_key: "{{SEARXNG_SECRET_KEY}}"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 1   # 0 off, 1 moderate, 2 strict
  autocomplete: ""
  formats:
    - html
    - json
