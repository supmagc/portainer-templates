# Refuse to run the SD rsync unless this unit's ExecStart target (/dev/sda) is
# really the SanDisk USB card reader (see /usr/local/sbin/sdmirror-guard.sh - it
# reads the device back out of ExecStart via the %n passed here). ExecStartPre
# failure aborts the unit before it mounts/rsyncs the target, and shows up as a
# failed unit in node_exporter's systemd metrics.
#
# This drop-in is added on top of the sdrsync.service that openhabian-config
# (option 53) generates - deploy it AFTER running that setup.
[Service]
ExecStartPre=/usr/local/sbin/sdmirror-guard.sh %n
