[Unit]
Before=openhab.service influxdb.service grafana-server.service mosquitto.service exim4.service habapp.service promtail.service loki.service

[Service]
# A stale device list (left by a power cut) makes `start` skip everything silently, exit 0.
ExecStartPre=-/bin/rm -f /usr/local/lib/zram-config/zram-device-list
