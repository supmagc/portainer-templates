# Overrides openhabian-config option 53's default OnCalendar (semiannual,
# Jan 1 + Jul 1) to run every 2 months instead. Deploy AFTER running that
# setup, same as sdrawcopy.service.d/guard.conf.
#
# The empty OnCalendar= first is required - systemd list directives append,
# so without it this would add a second schedule on top of the stock one
# instead of replacing it.
[Timer]
OnCalendar=
OnCalendar=*-01,03,05,07,09,11-01
