# Refuse to run the raw SD copy unless this unit's ExecStart target (/dev/sda) is
# really the SanDisk USB card reader (see /usr/local/sbin/sdmirror-guard.sh - it
# reads the device back out of ExecStart via the %n passed here). ExecStartPre
# failure aborts the unit before dd touches the device, and shows up as a failed
# unit in node_exporter's systemd metrics.
#
# This drop-in is added on top of the sdrawcopy.service that openhabian-config
# (option 53) generates - deploy it AFTER running that setup.
[Service]
ExecStartPre=/usr/local/sbin/sdmirror-guard.sh %n
