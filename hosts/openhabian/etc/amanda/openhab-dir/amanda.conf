# /etc/amanda/openhab-dir/amanda.conf
#
# HAND-OWNED - do NOT run `openhabian-config` -> Backup -> Amanda. That regenerates
# this file from /opt/openhabian/includes/amanda/amanda.conf-template, which has no
# concept of a second storage and will drop the `nas` blocks below. If it is ever
# run, redeploy this file (scripts\deploy.ps1 -DeployHost openhabian
# -DeployPath etc/amanda) and re-run `sudo -u backup amcheck openhab-dir`.
#
# Dual-storage layout (see docs/backups.md):
#   - storage "ssd"  -> chg-disk vtapes on the local Transcend SSD  (fast, primary)
#   - storage "nas"  -> chg-disk vtapes on the NFS mount from the NAS -> Backblaze
# amdump writes BOTH in one run, fed from the holding disk. If the NAS is down the
# SSD write still succeeds and the dump waits in holding for a later amflush.
#
# BRING-UP: the `nas` storage is commented out below for Phase 1 (SSD only). Do
# not uncomment it until Phase 3 - the NFS mount currently hangs and `amcheck`
# would fail. Phase 3 = uncomment the `define changer ch_nas` / `define policy
# pol_nas` / `define storage nas` block AND switch the `storage` line.

org               "openHABian openhab-dir"
mailto            "supmagc@gmail.com"
dumpuser          "backup"
netusage          90000 Kbps            # 90 MB/s bandwidth cap

dumpcycle         7                     # one full dump per 7 days
runspercycle      7                     # ...spread over 7 daily runs
tapecycle         15 tapes              # global default; per-storage `policy` overrides retention

infofile          "/var/lib/amanda/openhab-dir/curinfo"
logdir            "/var/log/amanda/openhab-dir"
indexdir          "/var/lib/amanda/openhab-dir/index"
tapelist          "/etc/amanda/openhab-dir/tapelist"
mailer            "/usr/bin/mail"
amrecover_changer "ch_ssd"              # restore from the fast local copy by default

taper-parallel-write 2

# -------------------------------------------------------------------------------
# Holding disk  (NEW - openHABian's template sets `holdingdisk no`; the
# multi-storage double-write and graceful NAS-down degradation both need one.)
# -------------------------------------------------------------------------------
holdingdisk hd1 {
    directory "/mnt/ssd/amanda/holding"
    use       15 Gb                     # a whole run is ~1.2 GB; positive = "use up to"
    chunksize 1 Gb
}

# -------------------------------------------------------------------------------
# Tape geometry - one vtape "slot" = one file-backed volume.
# -------------------------------------------------------------------------------
define tapetype DIRECTORY {
    comment "vtape slot"
    length 5120 mbytes                  # 5 GB per slot (a run fits in one)
}
tapetype DIRECTORY

# -------------------------------------------------------------------------------
# storage "ssd"  - local Transcend SSD, primary copy, ~2 weeks of history
# -------------------------------------------------------------------------------
define changer ch_ssd {
    tpchanger "chg-disk:/mnt/ssd/amanda/openhab-dir/slots"
    # If amcheck rejects these two properties, remove them and pre-create
    # slot1..slotN dirs under the slots/ path instead.
    property "num-slot" "14"
    property "auto-create-slot" "yes"
}
define policy pol_ssd {
    retention-tapes 14
}
define storage ssd {
    tapedev   "ch_ssd"
    tapepool  "$c-ssd"                  # namespaces labels within the shared tapelist
    policy    "pol_ssd"
    runtapes  5
    labelstr  "^ssd-openhab-[0-9]+$"
    autolabel "ssd-openhab-%%" empty
    erase-on-failure yes
}

# -------------------------------------------------------------------------------
# storage "nas"  - NFS vtapes on the NAS (-> ZFS snapshots -> Backblaze B2),
# offsite copy, ~3 months of history.
# PHASE 3: uncomment this whole block once `mount /mnt/backup` succeeds and
# /mnt/backup/openhab-dir/slots exists (owned backup:backup).
# -------------------------------------------------------------------------------
define changer ch_nas {
    tpchanger "chg-disk:/mnt/backup/openhab-dir/slots"
    property "num-slot" "90"
    property "auto-create-slot" "yes"
}
define policy pol_nas {
    retention-tapes 90
}
define storage nas {
    tapedev   "ch_nas"
    tapepool  "$c-nas"
    policy    "pol_nas"
    runtapes  5
    labelstr  "^nas-openhab-[0-9]+$"
    autolabel "nas-openhab-%%" empty
}

storage "ssd" "nas"      # PHASE 3: switch to this line (and uncomment ch_nas above)

# -------------------------------------------------------------------------------
# Dump behaviour
# -------------------------------------------------------------------------------
define application-tool app_amgtar {
    plugin          "amgtar"
    property        "COMMAND-OPTIONS" "--exclude-from=/opt/openhabian/includes/amanda/amanda-exclude-list"
    property        "ONE-FILE-SYSTEM" "NO"
    property        "NORMAL"          ": socket ignored$"
    property append "NORMAL"          "file changed as we read it$"
    property append "NORMAL"          ": directory is on a different filesystem; not dumped$"
    property append "NORMAL"          ": File removed before we read it$"
}

define dumptype global {
    maxdumps    2
    holdingdisk auto                    # was: no
    index       yes
}
define dumptype user-tar {
    global
    program     "APPLICATION"
    application  "app_amgtar"
    estimate     server
    priority     medium
}
define dumptype comp-user-tar {
    user-tar
    compress client fast
}
