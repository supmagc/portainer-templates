version: "3.3"

name: extras

networks:
  default:
    driver: bridge
  downloads_default:
    external: true
  utilities_default:
    external: true

services:
  stash:
    image: stashapp/stash:latest
    container_name: stash
    networks:
      - default
      - utilities_default
    pull_policy: missing
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.stash-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.stash.rule=Host(`stash.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.stash.entrypoints=web"
      - "traefik.http.routers.stash.middlewares=stash-https-redirect"
      - "traefik.http.routers.stash-secure.rule=Host(`stash.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.stash-secure.entrypoints=web-secure"
      - "traefik.http.routers.stash-secure.tls=true"
      - "traefik.http.routers.stash-secure.tls.certresolver=stepca"
    ports:
      - "${NETWORK_INTERFACE}:9999:9999"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /mnt/fastpool/system/extras/stash/config:/root/.stash
      - /mnt/leftpool/extras:/data
      - /mnt/fastpool/system/extras/stash/metadata:/metadata
      - /mnt/fastpool/system/extras/stash/cache:/cache
      - /mnt/fastpool/system/extras/stash/blobs:/blobs
      - /mnt/fastpool/system/extras/stash/generated:/generated
      - /mnt/rightpool/backup/automated/stash:/backup
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      - STASH_PORT=9999
      - USER=${APP_USER}
      - GROUP=${APP_GROUP}
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache py3-watchdog && exec stash"]
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"


  namer:
    image: ghcr.io/theporndatabase/namer:latest
    container_name: namer
    networks:
      - default
    pull_policy: missing
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.namer-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.namer.rule=Host(`namer.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.namer.entrypoints=web"
      - "traefik.http.routers.namer.middlewares=namer-https-redirect"
      - "traefik.http.routers.namer-secure.rule=Host(`namer.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.namer-secure.entrypoints=web-secure"
      - "traefik.http.routers.namer-secure.tls=true"
      - "traefik.http.routers.namer-secure.tls.certresolver=stepca"
    ports:
      - "${NETWORK_INTERFACE}:6980:6980"
    environment:
      - PUID=${APP_USER}
      - PGID=${APP_GROUP}
      - TZ=${APP_TIMEZONE}
      - NAMER_CONFIG=/config/namer.cfg
    volumes:
      - /mnt/fastpool/system/extras/namer:/config
      - /mnt/leftpool/extras:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://namer:6980/api/healthcheck || exit 1" ]
      interval: 1m
      timeout: 30s

  whisparr:
    image: ghcr.io/hotio/whisparr:v2-develop
    container_name: whisparr
    networks:
      - default
      - downloads_default
    pull_policy: missing
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.whisparr-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.whisparr.rule=Host(`whisparr.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.whisparr.entrypoints=web"
      - "traefik.http.routers.whisparr.middlewares=whisparr-https-redirect"
      - "traefik.http.routers.whisparr-secure.rule=Host(`whisparr.${NETWORK_DOMAIN}`)"
      - "traefik.http.routers.whisparr-secure.entrypoints=web-secure"
      - "traefik.http.routers.whisparr-secure.tls=true"
      - "traefik.http.routers.whisparr-secure.tls.certresolver=stepca"
    ports:
      - "${NETWORK_INTERFACE}:6969:6969"
    environment:
      - PUID=${APP_USER}
      - PGID=${APP_GROUP}
      - TZ=${APP_TIMEZONE}
      - UMASK=002
    volumes:
      - /mnt/fastpool/system/extras/whisparr:/config
      - /mnt/rightpool/downloads:/downloads
      - /mnt/leftpool/extras:/data
      - /mnt/rightpool/backup/automated/whisparr:/backup
